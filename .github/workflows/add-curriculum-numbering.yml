name: Add curriculum numbering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-curriculum-numbering.yml'
      - 'index.html'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add lesson numbering to curriculum table
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          repl = {
            '<td>펫 산업 특강: 핵심 동향·기회영역·실패유형·진입조건·데이터 출처</td>':'<td>0. 펫 산업 특강: 핵심 동향·기회영역·실패유형·진입조건·데이터 출처</td>',
            '<td>시장·트렌드·경쟁사 분석</td>':'<td>1. 시장·트렌드·경쟁사 분석</td>',
            '<td>공식데이터 기반 니즈·페인포인트 리서치</td>':'<td>2. 공식데이터 기반 니즈·페인포인트 리서치</td>',
            '<td>틈새 도출·아이템 확정</td>':'<td>3. 틈새 도출·아이템 확정</td>',
            '<td>사업계획서 핵심항목</td>':'<td>4. 사업계획서 핵심항목</td>',
            '<td>MVP 범위·유저 플로우·AI 역할 정의</td>':'<td>5.1 MVP 범위·유저 플로우·AI 역할 정의</td>',
            '<td>AI 포함 MVP PRD 작성</td>':'<td>5.2 AI 포함 MVP PRD 작성</td>',
            '<td>AI 기반 웹 MVP 구현</td>':'<td>5.3 AI 기반 웹 MVP 구현</td>',
            '<td>최종 산출물 정리·제출</td>':'<td>6. 최종 산출물 정리·제출</td>'
          }
          for old, new in repl.items():
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Sync curriculum numbering with lecture steps'
          git push
