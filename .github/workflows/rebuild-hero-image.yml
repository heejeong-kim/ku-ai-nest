name: Rebuild hero image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-hero-image.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild hero image
        run: |
          cat tmp/hero.part1.b64 tmp/hero.part2.b64 tmp/hero.part3.b64 tmp/hero.part4.b64 tmp/hero.part5.b64 | base64 -d > assets/hero-pet.jpg
          test $(stat -c%s assets/hero-pet.jpg) -eq 24074
          file assets/hero-pet.jpg
      - name: Commit rebuilt image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero-pet.jpg
          git commit -m 'Rebuild hero image asset'
          git push
