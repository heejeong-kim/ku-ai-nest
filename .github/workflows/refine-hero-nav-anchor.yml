name: Refine hero navigation and curriculum anchor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-hero-nav-anchor.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero navigation and curriculum anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old='<div class="hero-actions"><a class="btn primary" href="#curriculum">커리큘럼 보기 ↓</a><a class="btn ghost" href="#special">특강 보기 →</a><a class="btn ghost" href="#lecture">강의교안 바로가기 →</a></div>'
          new='<div class="hero-actions hero-nav-cta" aria-label="주요 섹션 이동"><a class="hero-nav-link" href="#curriculum-table"><span aria-hidden="true">🐾</span>커리큘럼</a><span class="hero-nav-sep" aria-hidden="true">|</span><a class="hero-nav-link" href="#special"><span aria-hidden="true">📈</span>특강</a><span class="hero-nav-sep" aria-hidden="true">|</span><a class="hero-nav-link" href="#lecture"><span aria-hidden="true">📚</span>강의교안</a></div>'
          if old not in s:
              raise SystemExit('hero nav html marker not found')
          s=s.replace(old,new,1)

          old='<nav class="float-nav" aria-label="페이지 빠른 이동"><a href="#curriculum" aria-label="커리큘럼">'
          new='<nav class="float-nav" aria-label="페이지 빠른 이동"><a href="#curriculum-table" aria-label="커리큘럼">'
          if old not in s:
              raise SystemExit('float nav curriculum marker not found')
          s=s.replace(old,new,1)

          old='<div class="card schedule"><div class="table-wrap">'
          new='<div class="card schedule" id="curriculum-table"><div class="table-wrap">'
          if old not in s:
              raise SystemExit('schedule marker not found')
          s=s.replace(old,new,1)

          old='.hero-actions{display:flex;gap:10px;margin-top:36px;flex-wrap:wrap}.btn{display:inline-flex;text-decoration:none;align-items:center;border-radius:12px;padding:13px 18px;font-weight:700}.btn.primary{background:#171717;color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:#171717}'
          new='.hero-actions{display:flex;gap:10px;margin-top:36px;flex-wrap:wrap}.hero-nav-cta{display:inline-flex;align-items:center;gap:2px;width:max-content;max-width:54%;padding:7px 8px;border:1px solid rgba(138,112,0,.18);border-radius:16px;background:rgba(255,255,255,.76);box-shadow:0 12px 30px rgba(88,69,0,.08);backdrop-filter:blur(10px)}.hero-nav-link{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:16px;font-weight:700;white-space:nowrap;transition:transform .22s ease,background .22s ease}.hero-nav-link:hover{background:var(--yellow-soft);transform:translateY(-2px)}.hero-nav-link span{font-size:17px;line-height:1}.hero-nav-sep{color:#c7bc8a;font-weight:500;line-height:1}.btn{display:inline-flex;text-decoration:none;align-items:center;border-radius:12px;padding:13px 18px;font-weight:700}.btn.primary{background:#171717;color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:#171717}'
          if old not in s:
              raise SystemExit('hero action css marker not found')
          s=s.replace(old,new,1)

          old='.schedule{margin-top:18px;overflow:hidden}'
          new='.schedule{margin-top:18px;overflow:hidden;scroll-margin-top:24px}'
          if old not in s:
              raise SystemExit('schedule css marker not found')
          s=s.replace(old,new,1)

          old='@media(max-width:760px){body{font-size:18px}.section-head{align-items:flex-start}.special-deck-cta{padding:10px 12px;font-size:14px}.output-cards{grid-template-columns:1fr}'
          new='@media(max-width:760px){body{font-size:18px}.section-head{align-items:flex-start}.special-deck-cta{padding:10px 12px;font-size:14px}.hero-nav-cta{max-width:100%;padding:6px}.hero-nav-link{font-size:14px;padding:7px 6px;gap:4px}.hero-nav-link span{font-size:15px}.hero-nav-sep{font-size:13px}.output-cards{grid-template-columns:1fr}'
          if old not in s:
              raise SystemExit('mobile css marker not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine hero navigation and curriculum anchor'
          git push
