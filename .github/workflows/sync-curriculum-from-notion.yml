name: Sync curriculum from Notion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-curriculum-from-notion.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync curriculum table
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          new_table = '''<div class="card schedule"><div class="table-wrap"><table class="data-table curriculum-table"><colgroup><col class="col-time"><col class="col-duration"><col class="col-stage"><col class="col-work"></colgroup><thead><tr><th>시간</th><th>소요</th><th>구성</th><th>작업 내용</th></tr></thead><tbody><tr><td>13:00–13:05</td><td>5분</td><td><b>오리엔테이션</b></td><td><ul class="task-list"><li>산출물 점검·팀 역할·진행 방식 확인</li></ul></td></tr><tr><td>13:05–13:45</td><td>40분</td><td><b>특강</b></td><td><ul class="task-list"><li>핵심 산업 동향·기회영역 확인</li><li>진입조건·데이터 출처 확인</li></ul></td></tr><tr class="break-row"><td>13:45–13:50</td><td>5분</td><td><b>휴식</b></td><td></td></tr><tr><td>13:50–14:40</td><td>50분</td><td><b>1. 시장·트렌드·경쟁사 분석</b></td><td><ul class="task-list"><li>아이디어·시장·트렌드 구조화</li><li>경쟁 비교 후 페인포인트 후보 도출</li></ul></td></tr><tr class="break-row"><td>14:40–14:45</td><td>5분</td><td><b>휴식</b></td><td></td></tr><tr><td>14:45–15:20</td><td>35분</td><td><b>2. 공식데이터 기반 고객 니즈·페인포인트 검증</b></td><td><ul class="task-list"><li>페인포인트 후보를 공식데이터로 검증</li><li>문제 규모·대상 고객·손실 근거 정리</li></ul></td></tr><tr><td>15:20–15:35</td><td>15분</td><td><b>3. 최종 아이템 확정·가치제안</b></td><td><ul class="task-list"><li>핵심 페인포인트·최종 아이템 확정</li><li>고객·해결방식·가치제안 정리</li></ul></td></tr><tr class="break-row"><td>15:35–15:40</td><td>5분</td><td><b>휴식</b></td><td></td></tr><tr><td>15:40–16:10</td><td>30분</td><td><b>4. 사업계획서 핵심항목·초안 작성</b></td><td><ul class="task-list"><li>사업계획서 핵심항목 정리</li><li>1페이지 초안 작성</li></ul></td></tr><tr><td>16:10–16:30</td><td>20분</td><td><b>5.1 MVP 범위·유저 플로우·AI 역할 정의</b></td><td><ul class="task-list"><li>MVP 검증 가설·핵심 기능 3개 정의</li><li>AI 역할·유저 플로우 정리</li></ul></td></tr><tr class="break-row"><td>16:30–16:35</td><td>5분</td><td><b>휴식</b></td><td></td></tr><tr><td>16:35–16:50</td><td>15분</td><td><b>5.2~5.3 AI 포함 MVP PRD·웹 MVP 구현</b></td><td><ul class="task-list"><li>PRD 정리</li><li>웹 MVP 구현, 필요 시 Google Sheets 연동</li></ul></td></tr><tr><td>16:50–17:00</td><td>10분</td><td><b>6. 최종 산출물 정리·제출</b></td><td><ul class="task-list"><li>사업계획서·MVP·검증 결과 제출 패키지 정리</li><li>핵심 내용 일치 및 링크 작동 최종 확인</li></ul></td></tr></tbody></table></div></div>'''

          pattern = r'<div class="card schedule"><div class="table-wrap"><table class="data-table curriculum-table">.*?</table></div></div>'
          s2, n = re.subn(pattern, new_table, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'curriculum schedule replacement count={n}')

          css_marker = '.task-list{margin:0;padding-left:22px}.task-list li{margin:2px 0}.source-list{font-size:16px;color:var(--muted)}'
          css_repl = '.task-list{margin:0;padding-left:22px}.task-list li{margin:2px 0}.curriculum-table .break-row td{background:#f2f2f0;color:var(--muted)}.curriculum-table .break-row td:first-child{color:var(--muted)}.source-list{font-size:16px;color:var(--muted)}'
          if css_marker in s2:
              s2 = s2.replace(css_marker, css_repl, 1)
          elif '.curriculum-table .break-row td{' not in s2:
              raise SystemExit('curriculum css marker not found')

          p.write_text(s2)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Sync curriculum table from Notion'
          git push
