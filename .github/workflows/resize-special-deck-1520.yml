name: Resize special lecture deck to 1520
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resize-special-deck-1520.yml'
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resize deck canvas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('special-lecture.html')
          s=p.read_text()
          replacements=[
            ('--DW:1280px;','--DW:1520px;'),
            ('--DH:905px;','--DH:1075px;'),
            ('const sw=1280,sh=905;','const sw=1520,sh=1075;'),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit(f'marker not found: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-lecture.html
          git commit -m 'Resize special lecture deck to 1520 canvas'
          git push
