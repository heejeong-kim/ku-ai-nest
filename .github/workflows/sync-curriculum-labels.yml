name: Sync curriculum labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-curriculum-labels.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels and Claude Research note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          repl = {
            '<td>2. 공식데이터 기반 니즈·페인포인트 리서치</td>':'<td>2. 공식데이터 기반 고객 니즈·페인포인트 검증</td>',
            '<td>3. 틈새 도출·아이템 확정</td>':'<td>3. 최종 아이템 확정·가치제안</td>',
            '<td>4. 사업계획서 핵심항목</td>':'<td>4. 사업계획서 핵심항목·초안 작성</td>',
          }
          for old, new in repl.items():
              s = s.replace(old, new, 1)
          old = '<li>모든 조사 결과에서 출처 링크와 자료 기준연도를 함께 확보할 것</li></ul></div>'
          new = '<li>모든 조사 결과에서 출처 링크와 자료 기준연도를 함께 확보할 것</li><li><b>[참고] Claude Research가 너무 느릴 경우 다른 도구 활용하세요.</b></li></ul></div>'
          if old in s and 'Claude Research가 너무 느릴 경우' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Sync curriculum labels with lecture notes'
          git push
