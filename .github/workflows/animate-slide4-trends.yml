name: Animate slide 4 trend charts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add continuous motion to slide 4 charts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('special-lecture.html')
          s=p.read_text()
          marker='@media(prefers-reduced-motion:reduce)'
          css='''
/* slide 4 continuous trend motion */
.trend-svg .l{transform-box:fill-box;transform-origin:center;animation:trendLineFloat 3.8s ease-in-out infinite,trendLineBreath 2.7s ease-in-out infinite;will-change:transform,opacity}
.trend-svg .d{transform-box:fill-box;transform-origin:center;animation:trendDotPulse 2.4s ease-in-out infinite;will-change:transform,opacity}
.trend-svg circle:nth-of-type(1){animation-delay:0s}.trend-svg circle:nth-of-type(2){animation-delay:.22s}.trend-svg circle:nth-of-type(3){animation-delay:.44s}.trend-svg circle:nth-of-type(4){animation-delay:.66s}.trend-svg circle:nth-of-type(5){animation:trendReboundPulse 1.8s ease-in-out .88s infinite}.trend-svg circle:nth-of-type(6){animation-delay:1.1s}
@keyframes trendLineFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes trendLineBreath{0%,100%{opacity:.78;stroke-width:4.7}50%{opacity:1;stroke-width:6.2}}
@keyframes trendDotPulse{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.32);opacity:1}}
@keyframes trendReboundPulse{0%,100%{transform:scale(1);opacity:.9}45%{transform:scale(1.65);opacity:1}65%{transform:scale(1.28);opacity:1}}
'''
          if 'trendReboundPulse' in s:
              print('animation already present')
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('reduced motion marker not found')
          s=s.replace(marker,css+marker,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-lecture.html
          git commit -m 'Animate slide 4 trend charts continuously'
          git push
