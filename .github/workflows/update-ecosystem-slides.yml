name: Update ecosystem slides
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-ecosystem-slides.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update startup ecosystem and investment slides
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('special-lecture.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
.eco-context{display:grid;grid-template-columns:1fr .9fr;gap:22px;align-items:stretch}.eco-note{margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff7c7;color:#6a5400;font-size:18px;font-weight:700;line-height:1.45}.snapshot-panel{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:26px 28px;box-shadow:var(--shadow)}.snapshot-title{font-size:20px;font-weight:700;color:#806500;margin-bottom:12px}.snapshot-list{display:grid;gap:12px}.snapshot-list div{padding:14px 16px;border-radius:14px;background:#faf7e9;font-size:18px;line-height:1.45;color:var(--ink2);font-weight:600}.snapshot-list b{color:#171717}.snapshot-warn{margin-top:14px;border:1.5px dashed #d9c26b;border-radius:15px;padding:14px 16px;color:#705800;background:#fffdf0;font-size:18px;font-weight:700;line-height:1.45}.invest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.invest-card{min-height:154px;border-radius:20px;border:1.5px solid rgba(49,90,216,.16);background:#fff;padding:18px 19px;box-shadow:var(--shadow);position:relative;overflow:hidden}.invest-card:before{content:"";position:absolute;right:-34px;top:-34px;width:92px;height:92px;border-radius:999px;background:rgba(245,196,0,.18)}.invest-card h3{font-size:22px;line-height:1.15;margin-bottom:8px;letter-spacing:-.035em}.invest-card .field{display:inline-flex;width:max-content;border-radius:999px;background:#fff1a7;color:#6d5700;padding:5px 9px;font-size:13.5px;font-weight:700;margin-bottom:9px}.invest-card p{font-size:18px;line-height:1.42;color:var(--ink2);font-weight:600}.invest-card b{color:#171717}.invest-card.blue{background:linear-gradient(150deg,#fff,#eef2ff)}.invest-card.dark{background:#171717;color:#fff;border-color:#171717}.invest-card.dark h3,.invest-card.dark p,.invest-card.dark b{color:#fff}.invest-card.dark .field{background:rgba(245,196,0,.18);color:#ffe36a}.invest-flow{margin-top:18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.invest-flow div{border-radius:15px;padding:15px 17px;background:#fff7c7;color:#6a5400;font-size:18px;font-weight:700;text-align:center}.invest-flow div:nth-child(2){background:#e8edff;color:#315ad8}.invest-flow div:nth-child(3){background:#171717;color:#ffe36a}
'''
          if '.eco-context{' not in s:
              marker = '@keyframes shimmer'
              if marker in s:
                  s = s.replace(marker, css + '\n' + marker, 1)
              else:
                  s = s.replace('</style>', css + '\n</style>', 1)

          s = s.replace('OPPORTUNITY · 1/3', 'OPPORTUNITY · 1/4')
          s = s.replace('OPPORTUNITY · 3/3', 'OPPORTUNITY · 4/4')
          s = s.replace('data-menu="2-3. 기회영역별 실제 확인 사례"', 'data-menu="2-4. 기회영역별 실제 확인 사례"')

          new_slides = '''<section class="slide" data-part="2. 창업 기회" data-menu="2-2. 스타트업 생태계 규모 신호"><header class="s-head"><p class="kicker" data-anim style="--i:0">OPPORTUNITY · 2/4</p><h2 class="s-title" data-anim style="--i:1">스타트업 생태계 규모 신호</h2><p class="s-sub" data-anim style="--i:2">과거 투자유치 생태계 규모와 현재 매출 확인 기업 풀을 독립적으로 확인</p></header><div class="s-body"><div class="eco-context" data-anim style="--i:3"><article class="eco-card"><div class="eco-eye">2021 조사 · 2023 보도</div><div class="eco-v">144<small>개+</small></div><p class="eco-copy">블루포인트파트너스 조사 기준 투자를 유치한 국내 반려동물 스타트업 최소 144개 이상</p><div class="eco-pills"><span>최근 2년 투자유치 64개+</span><span>직전 2년 대비 1.8배</span><span>Series A 이상 42%</span></div><div class="eco-note">동일 기준 재집계 공개자료는 확인되지 않아 누적 시장 진입 규모의 역사적 기준선으로 활용</div></article><article class="eco-card light"><div class="eco-eye">2025 매출 확인 · THE VC</div><div class="eco-v">약 90<small>개</small></div><p class="eco-copy">2025년 매출 데이터가 확인되는 국내 비상장 반려동물 스타트업·중소기업의 현재 기업 풀</p><div class="eco-pills"><span>신규 창업 수 아님</span><span>투자기업 생존 수 아님</span><span>독립 스냅샷</span></div><div class="eco-note">조사기관·시점·모집단·집계방식이 달라 직접적인 생존율로 계산하지 않음</div></article></div><div class="snapshot-panel" data-anim style="--i:4"><div class="snapshot-title">두 지표를 함께 보는 방법</div><div class="snapshot-list"><div><b>144개+</b> — 2021년 시점 과거 투자유치 생태계가 어느 정도 형성됐는지 보여주는 진입 규모 신호</div><div><b>약 90개</b> — 2025년 매출이 확인되는 현재 기업 풀을 보여주는 최신 활동 신호</div></div><div class="snapshot-warn">두 수치는 직접 비교·연산하지 않고 과거 진입 규모와 현재 매출 확인 기업 풀을 각각 독립적으로 병기</div></div><p class="source">출처: <a href="http://www.pet-news.or.kr/news/articleView.html?idxno=2320" target="_blank">한국반려동물신문, [펫타트업 특집] 국내 반려동물 스타트업 현황(2023.1)</a> · <a href="https://thevc.kr/smart-collections/69ce021793445e583a6b7ecf" target="_blank">THE VC, 2025 매출 - 반려동물 비상장 스타트업</a></p></div><div class="insight" data-anim style="--i:6">스타트업 수는 하나의 정답이 아니라 <span class="y">집계 시점·기준·모집단</span>에 따라 달라지므로, 지표의 의미를 구분해서 해석해야 합니다</div></section>
<section class="slide" data-part="2. 창업 기회" data-menu="2-3. 최근 투자 흐름"><header class="s-head"><p class="kicker" data-anim style="--i:0">OPPORTUNITY · 3/4</p><h2 class="s-title" data-anim style="--i:1">최근 투자 흐름</h2><p class="s-sub" data-anim style="--i:2">2024년 말~2026년 자금 유입이 확인되는 문제영역</p></header><div class="s-body"><div class="invest-grid" data-anim style="--i:3"><article class="invest-card dark"><span class="field">의약품</span><h3>펫팜</h3><p>반려동물 의약품 · <b>Series B 65억원</b> · 누적 105억원</p></article><article class="invest-card blue"><span class="field">AI 홈케어</span><h3>십일리터</h3><p>AI 홈케어 진단 · <b>Pre-A 브릿지</b> · 누적 20억원+</p></article><article class="invest-card"><span class="field">AI 진료보조</span><h3>메타디엑스</h3><p>반려동물 진료 AI · <b>시드 후속 5억원</b></p></article><article class="invest-card"><span class="field">데이터</span><h3>비욘디</h3><p>반려동물 데이터 통합 · <b>Seed 투자</b></p></article><article class="invest-card blue"><span class="field">헬스케어</span><h3>바로펫</h3><p>체성분 분석 헬스케어 · <b>블루포인트 Seed</b></p></article><article class="invest-card dark"><span class="field">스킨케어</span><h3>허레이</h3><p>반려동물 스킨케어 · <b>시그나이트·롯데벤처스 Pre-A</b></p></article></div><div class="invest-flow" data-anim style="--i:4"><div>헬스케어</div><div>의약품·AI 진단</div><div>데이터 기반 관리</div></div><p class="source">출처: <a href="https://www.venturesquare.net/967872" target="_blank">벤처스퀘어, 펫팜 투자 유치</a> · <a href="https://www.fetv.co.kr/news/article.html?no=209108" target="_blank">FETV, 십일리터 투자 유치</a> · <a href="https://www.biotimes.co.kr/news/articleView.html?idxno=20614" target="_blank">바이오타임즈, 메타디엑스 투자 유치</a> · <a href="https://www.venturesquare.net/999212" target="_blank">벤처스퀘어, 비욘디 투자 유치</a> · <a href="https://www.unicornfactory.co.kr/article/2024111214330650501" target="_blank">유니콘팩토리, 바로펫 투자 유치</a> · <a href="https://www.hankyung.com/article/202605296855O" target="_blank">한국경제, 허레이 투자 유치</a></p></div><div class="insight" data-anim style="--i:6">단순히 투자받은 기업 수보다 <span class="y">실제 매출이 확인되는 기업 풀</span>과 <span class="b">최근 어느 문제영역에 신규 투자가 이어지는지</span>를 함께 보는 것이 현재 시장의 생존성과 기회영역을 판단하는 데 더 유용합니다</div></section>
'''

          pattern = re.compile(r'<section class="slide" data-part="2\. 창업 기회" data-menu="2-2\. 스타트업 생태계 규모 신호">.*?</section>\n', re.S)
          s, n = pattern.subn(new_slides, s, count=1)
          if n != 1:
              raise SystemExit('target ecosystem section not found')

          slide_count = len(re.findall(r'<section class="slide\b', s))
          if slide_count != 18:
              raise SystemExit(f'Expected 18 slides after split, found {slide_count}')
          if 'OPPORTUNITY · 3/4' not in s or 'data-menu="2-4. 기회영역별 실제 확인 사례"' not in s:
              raise SystemExit('Opportunity numbering update failed')

          p.write_text(s, encoding='utf-8')
          print('updated ecosystem and investment slides; slides=', slide_count)
          PY
      - name: Commit updated slides
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-lecture.html
          git commit -m 'Update startup ecosystem and investment flow slides'
          git push
# trigger 1
