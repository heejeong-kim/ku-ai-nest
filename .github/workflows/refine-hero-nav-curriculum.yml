name: Refine hero nav curriculum
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-hero-nav-curriculum.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine hero, floating nav and curriculum labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old=".hero{min-height:86vh;display:flex;align-items:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#fff 0%,#fff9da 60%,#f6cc1a 160%);border-bottom:1px solid var(--line)}.hero:before{content:\"\";position:absolute;right:0;top:0;width:52%;height:100%;background:url('assets/hero-pet.jpg') center center/cover no-repeat}.hero:after{content:\"\";position:absolute;inset:0;background:linear-gradient(90deg,#fff 0%,#fff9da 40%,rgba(255,249,218,.9) 48%,rgba(255,249,218,.2) 66%,rgba(255,255,255,0) 100%);pointer-events:none}.hero-inner{position:relative;z-index:1;padding:120px 0 100px}.hero-inner>p,.hero-inner>h1,.hero-inner>.hero-meta,.hero-inner>.hero-actions{max-width:54%}"
          new=".hero{min-height:86vh;display:flex;align-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 78% 28%,rgba(245,196,0,.22),transparent 24%),linear-gradient(135deg,#fff 0%,#fff9da 62%,#f6cc1a 160%);border-bottom:1px solid var(--line)}.hero:before,.hero:after{content:\"\";position:absolute;border-radius:999px;pointer-events:none;filter:blur(2px);opacity:.72}.hero:before{width:220px;height:220px;right:5%;top:9%;background:rgba(245,196,0,.22);animation:heroFloat 7s ease-in-out infinite}.hero:after{width:110px;height:110px;right:40%;bottom:13%;background:rgba(49,90,216,.09);animation:heroFloat 9s ease-in-out infinite reverse}.hero-inner{position:relative;z-index:2;padding:120px 0 100px}.hero-inner>p,.hero-inner>h1,.hero-inner>.hero-meta,.hero-inner>.hero-actions{max-width:54%}.hero-visual{position:absolute;z-index:1;right:max(32px,calc((100vw - 1520px)/2));top:50%;width:min(500px,36vw);aspect-ratio:16/9;transform:translateY(-50%);border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.92);box-shadow:0 30px 80px rgba(71,54,0,.2);background:#fff;transition:transform .2s ease,box-shadow .3s ease;will-change:transform}.hero-visual img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;image-rendering:auto}.hero-visual:after{content:\"\";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 42%,rgba(245,196,0,.10));pointer-events:none}.hero-visual:hover{box-shadow:0 38px 100px rgba(71,54,0,.28)}@keyframes heroFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-18px,0)}}"
          if old in s: s=s.replace(old,new,1)

          old_media="@media(max-width:1100px){.shell{width:min(100% - 40px,1520px)}.overview-grid{grid-template-columns:1fr}.info.wide{grid-column:auto}.section-head{display:block}.section-desc{margin-top:10px}.hero h1{font-size:56px}.hero:before{width:48%;}.hero-inner>p,.hero-inner>h1,.hero-inner>.hero-meta,.hero-inner>.hero-actions{max-width:58%}.lecture-nav a{min-width:138px}}"
          new_media="@media(max-width:1100px){.shell{width:min(100% - 40px,1520px)}.overview-grid{grid-template-columns:1fr}.info.wide{grid-column:auto}.section-head{display:block}.section-desc{margin-top:10px}.hero h1{font-size:56px}.hero-inner>p,.hero-inner>h1,.hero-inner>.hero-meta,.hero-inner>.hero-actions{max-width:56%}.hero-visual{right:24px;width:min(430px,38vw)}.lecture-nav a{min-width:138px}}"
          if old_media in s: s=s.replace(old_media,new_media,1)

          old_mobile="@media(max-width:760px){body{font-size:18px}.shell{width:min(100% - 28px,1520px)}.hero{min-height:auto;display:block}.hero:before{width:100%;height:42%;top:auto;bottom:0;background-position:center}.hero:after{background:linear-gradient(180deg,#fff 0%,#fff9da 54%,rgba(255,249,218,.92) 64%,rgba(255,249,218,.08) 100%)}.hero-inner{padding:92px 0 360px}.hero-inner>p,.hero-inner>h1,.hero-inner>.hero-meta,.hero-inner>.hero-actions{max-width:100%}.hero h1{font-size:40px}.hero p{font-size:19px}"
          new_mobile="@media(max-width:760px){body{font-size:18px}.shell{width:min(100% - 28px,1520px)}.hero{min-height:auto;display:block}.hero:before{width:130px;height:130px;right:-24px;top:40px}.hero:after{width:72px;height:72px;right:auto;left:-18px;bottom:20%}.hero-inner{padding:92px 0 330px}.hero-inner>p,.hero-inner>h1,.hero-inner>.hero-meta,.hero-inner>.hero-actions{max-width:100%}.hero-visual{top:auto;bottom:42px;left:50%;right:auto;width:min(92vw,520px);transform:translateX(-50%);border-radius:20px}.hero h1{font-size:40px}.hero p{font-size:19px}"
          if old_mobile in s: s=s.replace(old_mobile,new_mobile,1)

          marker=".backtop.show{opacity:1;pointer-events:auto}"
          extra=""".backtop.show{opacity:1;pointer-events:auto}.float-nav{position:fixed;right:24px;top:96px;z-index:120;display:flex;flex-direction:column;gap:10px}.float-nav a{position:relative;width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#171717;color:#f5c400;border:1px solid rgba(245,196,0,.35);box-shadow:0 10px 28px rgba(0,0,0,.16);text-decoration:none;transition:transform .2s ease,background .2s ease}.float-nav a:hover,.float-nav a:focus-visible{transform:translateX(-4px);background:#242424}.float-nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.float-nav .tip{position:absolute;right:58px;white-space:nowrap;padding:7px 10px;border-radius:8px;background:#171717;color:#fff;font-size:14px;font-weight:700;opacity:0;transform:translateX(6px);pointer-events:none;transition:.2s}.float-nav a:hover .tip,.float-nav a:focus-visible .tip{opacity:1;transform:none}@media(max-width:760px){.float-nav{right:12px;top:auto;bottom:82px}.float-nav a{width:44px;height:44px;border-radius:13px}.float-nav .tip{display:none}}@media(prefers-reduced-motion:reduce){.hero:before,.hero:after{animation:none}.hero-visual{transition:none}.float-nav a{transition:none}}"""
          if marker in s and '.float-nav{' not in s: s=s.replace(marker,extra,1)

          hero_old='<section class="hero" id="hero"><div class="shell hero-inner"><p class="eyebrow">2026 KU CAMPUSTOWN · AI NEST</p><h1><span>M3 산업 특화 × AI</span><br>펫 분야 특화교육</h1><p>시장 데이터와 공식 통계를 근거로 펫 분야의 미충족 니즈를 발굴하고, 사업 아이템을 구체화한 뒤 웹 MVP까지 구현하는 4시간 집중 과정</p><div class="hero-meta"><span class="pill">13:00–17:00 · 240분</span><span class="pill">팀 단위 2~4인</span><span class="pill">Claude · Artifacts · Claude Code</span></div><div class="hero-actions"><a class="btn primary" href="#curriculum">커리큘럼 보기 ↓</a><a class="btn ghost" href="#special">특강 보기 →</a><a class="btn ghost" href="#lecture">강의교안 바로가기 →</a></div></div></section>'
          hero_new=hero_old.replace('</div></section>','</div><div class="hero-visual" id="heroVisual"><img src="assets/hero-pet.jpg" alt="강아지와 비즈니스 문서, 노트북이 놓인 펫 비즈니스 업무 장면" width="720" height="405" decoding="async" fetchpriority="high"></div></section>')
          if hero_old in s: s=s.replace(hero_old,hero_new,1)

          nav='''<nav class="float-nav" aria-label="페이지 빠른 이동"><a href="#curriculum" aria-label="커리큘럼"><span class="tip">커리큘럼</span><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h2M14 14h2M8 18h2M14 18h2"/></svg></a><a href="#special" aria-label="특강"><span class="tip">특강</span><svg viewBox="0 0 24 24"><path d="M12 3l2.1 4.6L19 9.7l-3.6 3.5.9 5-4.3-2.4-4.3 2.4.9-5L5 9.7l4.9-2.1L12 3z"/></svg></a><a href="#lecture" aria-label="강의교안"><span class="tip">강의교안</span><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 12h6M9 16h6"/></svg></a></nav>'''
          if '<nav class="float-nav"' not in s: s=s.replace('<main>',nav+'\n<main>',1)

          repl={
          '<td>0. 펫 산업 특강: 핵심 동향·기회영역·실패유형·진입조건·데이터 출처</td>':'<td><b>0. 특강</b> &gt; 펫 산업 특강: 핵심 동향·기회영역·실패유형·진입조건·데이터 출처</td>',
          '<td>1. 시장·트렌드·경쟁사 분석</td>':'<td><b>1. 시장·경쟁</b> &gt; 시장·트렌드·경쟁사 분석</td>',
          '<td>2. 공식데이터 기반 고객 니즈·페인포인트 검증</td>':'<td><b>2. 페인포인트</b> &gt; 공식데이터 기반 니즈·페인포인트 리서치</td>',
          '<td>3. 최종 아이템 확정·가치제안</td>':'<td><b>3. 아이템·가치</b> &gt; 틈새 도출·아이템 확정</td>',
          '<td>4. 사업계획서 핵심항목·초안 작성</td>':'<td><b>4. 사업계획서</b> &gt; 사업계획서 핵심항목</td>',
          '<td>5.1 MVP 범위·유저 플로우·AI 역할 정의</td>':'<td><b>5. MVP</b> &gt; MVP 범위·유저 플로우·AI 역할 정의</td>',
          '<td>5.2 AI 포함 MVP PRD 작성</td>':'<td><b>5. MVP</b> &gt; AI 포함 MVP PRD 작성</td>',
          '<td>5.3 AI 기반 웹 MVP 구현</td>':'<td><b>5. MVP</b> &gt; AI 기반 웹 MVP 구현</td>',
          '<td>6. 최종 산출물 정리·제출</td>':'<td><b>6. 제출</b> &gt; 최종 산출물 정리·제출</td>'}
          for a,b in repl.items(): s=s.replace(a,b,1)

          js='''\n<script>\nconst hero=document.getElementById('hero');const visual=document.getElementById('heroVisual');if(hero&&visual&&matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches){hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;visual.style.transform=`translateY(-50%) translate(${x*10}px,${y*8}px) rotateX(${-y*2}deg) rotateY(${x*2}deg)`});hero.addEventListener('pointerleave',()=>{visual.style.transform='translateY(-50%)'})}\n</script>\n'''
          if 'const hero=document.getElementById(\'hero\')' not in s: s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine hero visual navigation and curriculum labels'
          git push
