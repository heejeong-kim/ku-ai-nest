name: Remove special lecture body
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-special-content.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep special lecture heading and CTA only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          replacement='''<section class="section" id="special"><div class="shell"><div class="section-head"><div><p class="kicker">SPECIAL LECTURE</p><h2>🕙 펫 산업 특강 : 시장을 문제와 기회 관점으로 보기</h2></div><a class="special-deck-cta" href="special-lecture.html" target="_blank" rel="noopener">슬라이드 발표자료 <span aria-hidden="true">↗</span></a></div></div></section>'''
          pattern=r'<section class="section" id="special">.*?</section>'
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'special section replacement count={n}')
          p.write_text(s2)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove special lecture body content'
          git push
