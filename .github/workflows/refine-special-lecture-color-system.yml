name: Refine special lecture color system
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-special-lecture-color-system.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply color system and insight emphasis
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('special-lecture.html')
          s=p.read_text()

          old='--yellow:#f5c400;'
          new='--main:#f5c400;--sub:#fff3b0;--second:#171717;--point:#315ad8;--point-soft:#eef2ff;--yellow:#f5c400;'
          if old not in s:
              raise SystemExit('root color marker not found')
          s=s.replace(old,new,1)

          marker='.insight::before{content:"\\201C";position:absolute;left:22px;top:8px;font-size:58px;line-height:1;color:var(--yellow-600);opacity:.52;font-family:Georgia,serif}'
          addition='''\n.insight{background:linear-gradient(90deg,var(--yellow-50) 0%,#fff 62%,var(--point-soft) 100%);border-left-color:var(--main)}\n.insight .insight-main{color:#8a6b00;font-weight:700}\n.insight .insight-point{display:inline-block;position:relative;color:var(--point);font-weight:700;z-index:0}\n.insight .insight-point::after{content:"";position:absolute;left:-3px;right:-3px;bottom:1px;height:8px;border-radius:999px;background:rgba(49,90,216,.13);z-index:-1}\n'''
          if marker not in s:
              raise SystemExit('insight css marker not found')
          if '.insight .insight-point' not in s:
              s=s.replace(marker,marker+addition,1)

          replacements=[
            ('시장 성장의 출발점은 단순한 규모 확대가 아니라 <b>양육가구가 늘고, 한 가구 안에서 반복 지출이 발생하는 구조</b>입니다.',
             '시장 성장의 출발점은 단순한 규모 확대가 아니라 <span class="insight-main">양육가구가 늘고, 한 가구 안에서 반복 지출이 발생하는 구조</span>입니다.'),
            ('반려동물 산업은 <b>양육가구 확대 → 반복 지출 증가 → 의료·미용·돌봄 서비스 이용 확대 → 관련 영업·인력 증가</b>로 이어지는 <b>생활서비스 산업</b>으로 확장되고 있습니다.',
             '반려동물 산업은 <span class="insight-main">양육가구 확대 → 반복 지출 증가 → 의료·미용·돌봄 서비스 이용 확대 → 관련 영업·인력 증가</span>로 이어지는 <span class="insight-point">생활서비스 산업</span>으로 확장되고 있습니다.')
          ]
          for old_text,new_text in replacements:
              if old_text not in s:
                  raise SystemExit('insight text marker not found: '+old_text[:30])
              s=s.replace(old_text,new_text,1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-lecture.html
          git commit -m 'Define lecture color system and emphasize insights'
          git push
