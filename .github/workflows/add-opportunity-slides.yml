name: Add opportunity slides
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-opportunity-slides.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add opportunity slides
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('special-lecture.html')
