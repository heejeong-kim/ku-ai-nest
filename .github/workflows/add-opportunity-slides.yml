          css='''
/* opportunity slides */
.signal-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.signal-card{position:relative;overflow:hidden;border-radius:26px;padding:30px 32px;background:#fff;border:1.5px solid var(--yellow-line);box-shadow:var(--shadow-sm);min-height:260px}.signal-card.dark{background:var(--second);color:#fff;border-color:var(--second);box-shadow:0 26px 54px -26px rgba(0,0,0,.5)}.signal-card.dark::after{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;background:rgba(245,196,0,.18)}.signal-card.point{background:linear-gradient(145deg,var(--point-soft),#fff);border-color:rgba(49,90,216,.28)}.signal-eyebrow{font-size:16px;font-weight:700;color:var(--yellow-700);letter-spacing:.04em}.signal-card.dark .signal-eyebrow{color:var(--main)}.signal-card.point .signal-eyebrow{color:var(--point)}.signal-value{font-size:64px;font-weight:700;letter-spacing:-.055em;line-height:1.02;margin-top:12px}.signal-value small{font-size:23px;color:var(--muted);margin-left:5px}.signal-card.dark .signal-value small{color:#e8d98f}.signal-copy{font-size:20px;line-height:1.47;color:var(--ink-2);margin-top:15px;word-break:keep-all}.signal-card.dark .signal-copy{color:#eee3b0}.delta{display:inline-flex;margin-top:14px;padding:7px 10px;border-radius:10px;background:var(--yellow-100);color:#6f5800;font-size:16px;font-weight:700}.signal-card.dark .delta{background:rgba(245,196,0,.14);color:#ffe88a}.signal-card.point .delta{background:#e8edff;color:var(--point)}.interpret-box{margin-top:18px;display:grid;grid-template-columns:1.02fr .98fr;gap:16px}.interpret-note,.interpret-rule{border-radius:18px;padding:19px 22px;font-size:17px;line-height:1.48;word-break:keep-all}.interpret-note{background:#fff;border:1.5px solid var(--yellow-line);color:var(--ink-2)}.interpret-rule{background:var(--point-soft);border:1.5px solid rgba(49,90,216,.22);color:#25366e}.interpret-note b{color:#856800}.interpret-rule b{color:var(--point)}
.opp-table{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}.opp-card{display:grid;grid-template-columns:150px 1fr;gap:12px;background:#fff;border:1px solid #e8e2cf;border-radius:16px;padding:13px 15px;box-shadow:0 8px 20px -18px rgba(50,40,0,.3);min-height:118px}.opp-side{display:flex;flex-direction:column;gap:7px}.opp-area{font-size:17px;font-weight:700;color:var(--second);line-height:1.3;word-break:keep-all}.opp-badge{display:inline-flex;width:max-content;padding:4px 7px;border-radius:8px;background:var(--yellow-100);color:#745c00;font-size:12px;font-weight:700}.opp-badge.pending{background:var(--point-soft);color:var(--point)}.opp-body{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opp-col{font-size:13.5px;line-height:1.42;color:var(--ink-2);word-break:keep-all}.opp-col b{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:3px}.opp-case{grid-column:1/-1;font-size:13.5px;line-height:1.4;color:var(--ink-2);word-break:keep-all}.opp-case b{color:var(--point)}.opp-case a{color:inherit;text-decoration:none}.case-sources{margin-top:10px;font-size:11.5px;line-height:1.42;color:var(--muted);word-break:keep-all}.case-sources a{color:#756000;text-decoration:none;border-bottom:1px solid rgba(117,96,0,.25)}.opportunity-insight{margin-top:11px;border-radius:15px;padding:14px 20px;background:linear-gradient(90deg,var(--yellow-50),#fff 58%,var(--point-soft));border:1px solid var(--yellow-line);font-size:17px;font-weight:700;line-height:1.42;color:var(--ink-2)}.opportunity-insight .demand{color:#8a6b00}.opportunity-insight .competition{color:var(--point)}
'''
          marker='.source-note{margin-top:10px;'
          if marker not in s: raise SystemExit('source note css marker not found')
          if '/* opportunity slides */' not in s:
              s=s.replace(marker,css+'\n'+marker,1)

          slides='''
