name: Expand market data slides
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-market-data-slides.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand static market data slides
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('special-lecture.html')
          s=p.read_text()
          extra_css='''.year-tag{display:inline-flex;align-items:center;width:max-content;padding:5px 10px;border-radius:999px;background:var(--yellow-100);color:#725b00;font-size:15px;font-weight:700;margin-bottom:9px}.mini-stats{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.mini-stat{display:inline-flex;align-items:center;padding:6px 9px;border-radius:10px;background:#f7f4ea;color:var(--ink-2);font-size:16px;font-weight:700;line-height:1.2}.metric-card.hl .mini-stat{background:#fff4b9}.cagr-chip{display:inline-flex;align-items:center;margin-top:18px;padding:8px 12px;border-radius:12px;background:rgba(245,196,0,.14);color:#ffe88a;font-size:18px;font-weight:700;width:max-content}.market-detail-grid{display:grid;grid-template-columns:1.06fr 1fr;gap:28px;align-items:stretch}.service-grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:28px;align-items:stretch}.service-hero{background:linear-gradient(145deg,#fff8c8,#fff);border:1.5px solid var(--yellow-line);border-radius:28px;padding:34px 36px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;min-height:430px}.service-big{font-size:84px;line-height:1.02;font-weight:700;letter-spacing:-.055em;margin-top:12px;color:var(--ink)}.service-big small{font-size:30px;color:var(--yellow-700);margin-left:5px}.service-copy{font-size:23px;line-height:1.48;color:var(--ink-2);margin-top:18px;word-break:keep-all}.industry-stack{display:grid;grid-template-columns:1fr 1fr;gap:16px}.industry-card{background:#fff;border:1.5px solid var(--yellow-line);border-radius:21px;padding:22px 23px;box-shadow:var(--shadow-sm)}.industry-label{font-size:16px;font-weight:700;color:var(--yellow-700)}.industry-value{font-size:43px;font-weight:700;letter-spacing:-.045em;margin-top:8px}.industry-value small{font-size:19px;color:var(--muted);margin-left:4px}.industry-desc{font-size:17px;color:var(--ink-2);line-height:1.4;margin-top:7px}.mix-chart{margin-top:13px;display:grid;gap:9px}.mix-row{display:grid;grid-template-columns:112px 1fr 58px;align-items:center;gap:12px;font-size:16px;font-weight:700;color:var(--ink-2)}.mix-track{height:14px;border-radius:999px;background:#f0ecdf;overflow:hidden}.mix-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--yellow-600),var(--yellow))}.source-note.compact{font-size:14px;margin-top:13px}.source-note a{font-weight:600}'''
          if '.year-tag{' not in s:
              s=s.replace('/* chrome */',extra_css+'\n/* chrome */',1)
          new='''<section class="slide" data-menu-part="1. 산업 동향" data-menu="1-1. 시장 성장·양육·지출">
      <header class="s-head"><p class="kicker" data-anim style="--i:0">MARKET DATA · 1/2</p><h2 class="s-title" data-anim style="--i:1">핵심 산업 동향·시장 데이터</h2><p class="s-sub" data-anim style="--i:2">시장 성장 · 양육가구 확대 · 반복 지출</p></header>
      <div class="s-body"><div class="market-detail-grid" data-anim style="--i:3">
        <section class="market-hero-stat"><div><div class="year-tag" style="background:rgba(245,196,0,.18);color:#ffe88a">2024 → 2034 전망</div><div class="stat-label">국내 반려동물 연관산업 시장규모</div><div class="stat-main">75억 → 169억<small>달러</small></div><div class="cagr-chip">연평균 성장률 CAGR 8.5%</div><p class="stat-desc">2024년 75억 달러에서 2034년 169억 달러까지 성장할 것으로 전망</p></div><div class="market-chart"><div class="bar-row"><span>2024</span><div class="bar-track"><div class="bar-fill" style="width:44%"></div></div><span>75억</span></div><div class="bar-row"><span>2034</span><div class="bar-track"><div class="bar-fill" style="width:100%"></div></div><span>169억</span></div></div></section>
        <section class="market-metrics"><article class="metric-card hl"><div class="year-tag">2025</div><div class="metric-k">양육가구</div><div class="metric-v">29.2<small>%</small></div><p class="metric-d">현재 거주지에서 직접 양육하는 가구 비율</p><div class="mini-stats"><span class="mini-stat">개 80.5%</span><span class="mini-stat">고양이 14.4%</span></div></article><article class="metric-card"><div class="year-tag">2025</div><div class="metric-k">월평균 양육비</div><div class="metric-v">12.1<small>만원</small></div><p class="metric-d">반려동물 1마리당 월평균 양육비</p><div class="mini-stats"><span class="mini-stat">병원비 3.7만원</span></div></article><article class="metric-card hl" style="grid-column:1/-1;min-height:160px"><div class="year-tag">2025 · 종별 양육비</div><div class="mini-stats"><span class="mini-stat" style="font-size:22px;padding:10px 14px">개 13.5만원 / 월</span><span class="mini-stat" style="font-size:22px;padding:10px 14px">고양이 9.2만원 / 월</span></div><p class="metric-d">양육비와 의료비가 반복적으로 발생하는 생활비형 지출 구조</p></article></section>
      </div><p class="source-note compact" data-anim style="--i:4">출처: <a href="https://www.mafra.go.kr/home/5109/subview.do%3Bjsessionid%3DMy8PdET0f9m8XQflCgjMtlFs.inst11?enc=Zm5jdDF8QEB8JTJGYmJzJTJGaG9tZSUyRjc5MiUyRjU3Njk4NCUyRmFydGNsVmlldy5kbyUzRg%3D%3D" target="_blank" rel="noopener">농림축산식품부 관련 보도자료(2026)</a> · <a href="https://www.mafra.go.kr/home/5109/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGaG9tZSUyRjc5MiUyRjU3Njk2MSUyRmFydGNsVmlldy5kbyUzRg%3D%3D" target="_blank" rel="noopener">2025년 반려동물 양육현황조사(2026 공표)</a></p></div>
      <div class="insight-wrap" data-anim style="--i:5"><div class="insight">시장 성장의 출발점은 단순한 규모 확대가 아니라 <b>양육가구가 늘고 한 가구 안에서 반복 지출이 발생하는 구조</b>입니다.</div></div>
    </section>

    <section class="slide" data-menu-part="1. 산업 동향" data-menu="1-2. 서비스 이용·산업 기반">
      <header class="s-head"><p class="kicker" data-anim style="--i:0">MARKET DATA · 2/2</p><h2 class="s-title" data-anim style="--i:1">서비스 이용과 산업 기반도 함께 커지고 있습니다</h2><p class="s-sub" data-anim style="--i:2">의료·생활서비스 이용 · 등록 반려동물 · 영업장 · 종사자</p></header>
      <div class="s-body"><div class="service-grid" data-anim style="--i:3">
        <section class="service-hero"><div><div class="year-tag">2025</div><div class="stat-label" style="color:var(--yellow-700)">최근 1년 이내 동물병원 이용 경험</div><div class="service-big">95.1<small>%</small></div><p class="service-copy">동물병원 이용 경험이 매우 높고, <b>미용·놀이·호텔 등 생활 서비스도 함께 이용</b>되는 구조로 확인됩니다.</p></div><div class="trend-flow" style="grid-template-columns:repeat(3,1fr);margin-top:20px"><div class="flow-step">의료</div><div class="flow-step">미용·놀이</div><div class="flow-step">호텔·돌봄</div></div></section>
        <section class="industry-stack"><article class="industry-card"><div class="year-tag">2025</div><div class="industry-label">누적 등록 반려동물</div><div class="industry-value">367.6<small>만 마리</small></div><p class="industry-desc">전년 대비 <b>+5.3%</b></p></article><article class="industry-card"><div class="year-tag">2025</div><div class="industry-label">반려동물 영업장</div><div class="industry-value">24,384<small>개소</small></div><p class="industry-desc">전년 대비 <b>+3.5%</b></p></article><article class="industry-card"><div class="year-tag">2025</div><div class="industry-label">관련 종사자</div><div class="industry-value">30,426<small>명</small></div><p class="industry-desc">전년 대비 <b>+3.8%</b></p></article><article class="industry-card"><div class="year-tag">2025 · 업종 비중</div><div class="mix-chart"><div class="mix-row"><span>미용업</span><div class="mix-track"><div class="mix-fill" style="width:100%"></div></div><strong>44.5%</strong></div><div class="mix-row"><span>위탁관리업</span><div class="mix-track"><div class="mix-fill" style="width:53.5%"></div></div><strong>23.8%</strong></div><div class="mix-row"><span>판매업</span><div class="mix-track"><div class="mix-fill" style="width:25.6%"></div></div><strong>11.4%</strong></div></div></article></section>
      </div><p class="source-note compact" data-anim style="--i:4">출처: <a href="https://www.mafra.go.kr/home/5109/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGaG9tZSUyRjc5MiUyRjU3Njk2MSUyRmFydGNsVmlldy5kbyUzRg%3D%3D" target="_blank" rel="noopener">2025년 반려동물 양육현황조사(2026 공표)</a> · <a href="https://www.mafra.go.kr/bbs/home/792/578282/artclView.do?sicode=01" target="_blank" rel="noopener">2025년 동물보호·복지 실태조사(2026 공표)</a></p></div>
      <div class="insight-wrap" data-anim style="--i:5"><div class="insight">반려동물 산업은 <b>양육가구 확대 → 반복 지출 증가 → 의료·미용·돌봄 서비스 이용 확대 → 관련 영업·인력 증가</b>로 이어지는 <b>생활서비스 산업</b>으로 확장되고 있습니다.</div></div>
    </section>'''
          pat=r'<section class="slide" data-menu-part="1\. 산업 동향".*?</section>\n  </main>'
          s2,n=re.subn(pat,new+'\n  </main>',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'slide replacement count={n}')
          p.write_text(s2)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-lecture.html
          git commit -m 'Expand market data across two slides'
          git push
