name: Rename special lecture slide title
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-special-slide-title.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename title
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('special-lecture.html')
          s=p.read_text()
          old='서비스 이용과 산업 기반도 함께 커지고 있습니다'
          new='서비스 이용·산업 기반 확대'
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'expected one title, found {count}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-lecture.html
          git commit -m 'Align special lecture slide title pattern'
          git push
