<div class="s-body"><div class="case-hero" data-anim style="--i:3"><aside class="case-brand"><div><div class="case-label">성장·시장검증 사례 1</div><div class="case-name">포옹</div><p class="case-tagline">기존 커머스 고객관계와 데이터를 인접 건강문제로 확장</p></div><div class="case-signal"><span>생식선생 누적 67t+ 판매</span><span>재구매율 87.1%</span><span>2024 포옹Labs 출시</span></div></aside><div class="case-detail"><div class="case-box"><h4>고객문제</h4><p>사료·영양뿐 아니라 건강 상태를 일상에서 지속적으로 확인하고 관리하기 어렵습니다.</p></div><div class="case-box"><h4>접근방식</h4><p>타액·분변·소변·모발을 활용한 비대면 건강검사와 앱 기반 결과 확인을 연결했습니다.</p></div><div class="case-box"><h4>학습 포인트</h4><p>기능 추가보다 <b>기존 고객 데이터·구매관계와 연결되는 인접 문제</b>로 확장하는 방식이 중요합니다.</p></div><div class="case-box apply"><h4>우리 프로젝트 적용점</h4><p>이미 확보한 고객 데이터·구매관계가 있다면, 그 데이터로 다음에 풀 수 있는 인접 문제를 1.1 아이디어 구조화에서 함께 점검합니다.</p></div></div></div><p class="source-note" data-anim style="--i:4">출처: <a href="https://platum.kr/archives/233266" target="_blank" rel="noopener">Platum, 포옹 건강 연구소 ‘포옹Labs’ 론칭(2024)</a></p></div>
</section>
<section class="slide" data-menu-part="6. 산업 사례" data-menu="6-2. 성장 사례 · 바프독">
<header class="s-head"><p class="kicker" data-anim style="--i:0">CASE STUDY · GROWTH 2/2</p><h2 class="s-title" data-anim style="--i:1">바프독 — 데이터 기반 맞춤식이 구독</h2><p class="s-sub" data-anim style="--i:2">AI 자체가 아니라 반복 데이터가 개인화 품질과 재구매를 만드는지 확인</p></header>
<div class="s-body"><div class="case-hero" data-anim style="--i:3"><aside class="case-brand point"><div><div class="case-label">성장·시장검증 사례 2</div><div class="case-name">바프독</div><p class="case-tagline">건강·질환·장내환경 데이터를 맞춤식이 정기구독과 연결</p></div><div class="case-signal"><span>누적 진단 데이터 12만 건+</span><span>정기구독 식이솔루션 29만 건+</span><span>2024 TIPS R&amp;D 선정</span></div></aside><div class="case-detail"><div class="case-box"><h4>고객문제</h4><p>건강상태·질환·장내환경에 맞는 식이와 영양제품을 보호자가 스스로 판단하기 어렵습니다.</p></div><div class="case-box"><h4>접근방식</h4><p>AI 질환 진단 모델, 반려동물 빅데이터, 장내 미생물 분석을 결합해 맞춤 식이·영양 솔루션을 구독 형태로 제공합니다.</p></div><div class="case-box"><h4>학습 포인트</h4><p>‘AI를 사용한다’가 아니라 <b>사용할수록 데이터가 쌓여 결과 품질과 재구매 구조가 좋아지는가</b>가 핵심입니다.</p></div><div class="case-box apply"><h4>우리 프로젝트 적용점</h4><p>5.1 MVP AI 기능 설계 시 AI 입력·처리·출력이 반복 데이터 축적과 다음 결과의 품질 개선으로 연결되는지 확인합니다.</p></div></div></div><p class="source-note" data-anim style="--i:4">출처: <a href="https://platum.kr/archives/232710" target="_blank" rel="noopener">Platum, 프레쉬아워 TIPS R&amp;D 선정(2024)</a></p></div>
</section>
<section class="slide" data-menu-part="6. 산업 사례" data-menu="6-3. 좌초 사례 · 도그마스터·앵그리펫츠">
<header class="s-head"><p class="kicker" data-anim style="--i:0">CASE STUDY · FAILURE 1/2</p><h2 class="s-title" data-anim style="--i:1">좌초 사례 — 도그마스터 · 앵그리펫츠</h2><p class="s-sub" data-anim style="--i:2">확인된 사실과 폐업 원인 추정을 구분하고, 검토 질문으로 학습</p></header>
<div class="s-body"><div class="failcase-grid" data-anim style="--i:3"><article class="failcase"><div class="failcase-head"><div class="failcase-name">워키도기 ‘도그마스터’</div><span class="failcase-badge">2024.12 폐업</span></div><p class="failcase-fact">2016년 설립, 강아지 훈련 앱 운영. 머신러닝·챗봇·비대면 관련 국가 R&amp;D 수행 이력이 확인됩니다.</p><div class="failcase-caution">공개자료만으로 폐업 원인을 수익성 부족·문제 검증 실패라고 단정할 수 없습니다.</div><div class="failcase-q"><b>검토 질문</b><br>온라인 훈련만으로 효과가 충분했는가? 무료 콘텐츠·오프라인 훈련사 대비 지불 이유가 분명했는가? 전문가 개입이 필요한 문제를 앱만으로 해결하려 하지는 않았는가?</div><p class="failcase-learn"><b>학습:</b> 기술개발·정부 R&amp;D와 실제 지불·재사용·운영구조는 별도 검증이 필요합니다.</p><p class="failcase-apply">적용: MVP가 온라인만으로 완결되는 문제인지, 전문가·오프라인 개입이 필요한지 구분합니다.</p></article><article class="failcase"><div class="failcase-head"><div class="failcase-name">앵그리펫츠 · 인터파크 펫</div><span class="failcase-badge">2023.05 폐업</span></div><p class="failcase-fact">2021년 9월 설립, 샌드박스네트워크·이경규 ‘앵그리독스’ IP와 결합한 펫 커머스로 출발. 운영기간 약 1.6년.</p><div class="failcase-caution">짧은 존속기간이 곧 IP 마케팅 실패를 의미하는 것은 아닙니다.</div><div class="failcase-q"><b>검토 질문</b><br>유명인 IP가 반복구매로 이어졌는가? 화제성과 커머스 상품력이 분리되지 않았는가? 초기 고객 유입 채널은 지속 가능했는가?</div><p class="failcase-learn"><b>학습:</b> 화제성으로 초기 유입은 만들 수 있어도 반복사용·재구매 구조가 없으면 지속성으로 이어지기 어렵습니다.</p><p class="failcase-apply">적용: 사용 상황을 정할 때 특정 이벤트·채널 의존인지 반복 방문 구조인지 함께 점검합니다.</p></article></div><p class="source-note" data-anim style="--i:4">출처: <a href="https://thevc.kr/walkydoggy" target="_blank" rel="noopener">THE VC, 워키도기</a> · <a href="https://thevc.kr/angrypets" target="_blank" rel="noopener">THE VC, 앵그리펫츠</a></p></div>
</section>
<section class="slide" data-menu-part="6. 산업 사례" data-menu="6-4. 좌초 사례 · 올라펫·펫그라운드">
<header class="s-head"><p class="kicker" data-anim style="--i:0">CASE STUDY · FAILURE 2/2</p><h2 class="s-title" data-anim style="--i:1">좌초 사례 — 올라펫 · 펫그라운드</h2><p class="s-sub" data-anim style="--i:2">장기 운영·투자·R&amp;D 이력이 있어도 사업 지속성은 별도 검증</p></header>
<div class="s-body"><div class="failcase-grid" data-anim style="--i:3"><article class="failcase"><div class="failcase-head"><div class="failcase-name">이에쓰씨컴퍼니 ‘올라펫’</div><span class="failcase-badge">2023.06 폐업</span></div><p class="failcase-fact">영국·스웨덴 프리미엄 펫푸드 브랜드 국내 독점 유통, Series A 투자유치. 10.9년간 운영 후 폐업이 확인됩니다.</p><div class="failcase-caution">장기간 운영·투자유치 이력이 있어도 초기 생존이 장기 지속성을 보장하지 않습니다.</div><div class="failcase-q"><b>검토 질문</b><br>독점유통이 경쟁사 진입 시 방어 가능한 차별점이었는가? 유통 마진 구조가 장기적으로 충분한 수익성을 냈는가?</div><p class="failcase-learn"><b>학습:</b> ‘얼마나 오래 운영했는가’보다 현재도 구조적으로 지속 가능한지가 중요합니다.</p><p class="failcase-apply">적용: 경쟁사 분석에서 차별점이 쉽게 복제되는지, 시간이 지나도 방어 가능한지 확인합니다.</p></article><article class="failcase"><div class="failcase-head"><div class="failcase-name">펫그라운드</div><span class="failcase-badge">2025.07 폐업</span></div><p class="failcase-fact">2023년 3월 설립, 반려동물 체지방 측정기기 개발. 2024년 관련 국가 R&amp;D 수행 이력이 확인됩니다.</p><div class="failcase-caution">국가 R&amp;D 수행 사실만으로 상용화·매출 성과를 단정할 수 없습니다.</div><div class="failcase-q"><b>검토 질문</b><br>하드웨어 제조·재고 비용을 회수할 가격·판매 구조였는가? 체지방 측정 단일 기능이 반복사용을 만들 만큼 충분한 가치였는가?</div><p class="failcase-learn"><b>학습:</b> 헬스케어·진단 분야는 기술 개발뿐 아니라 유통·가격·반복사용 구조를 초기에 검증해야 합니다.</p><p class="failcase-apply">적용: 하드웨어·진단 아이디어라면 제조·재고 없이 검증 가능한 최소 형태로 축소합니다.</p></article></div><p class="source-note" data-anim style="--i:4">출처: <a href="https://thevc.kr/esccompany" target="_blank" rel="noopener">THE VC, 이에쓰씨컴퍼니</a> · <a href="https://thevc.kr/petground" target="_blank" rel="noopener">THE VC, 펫그라운드</a></p></div><div class="insight-wrap" data-anim style="--i:5"><div class="insight">사례의 목적은 따라 하기보다 <span class="insight-main">문제 선택 → 해결방식 → 지불 이유 → 반복사용 → 사업 지속성</span>이 어떻게 연결되는지 비교하는 것입니다.</div></div>
</section>
