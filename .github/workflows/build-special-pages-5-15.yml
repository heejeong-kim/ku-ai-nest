<div class="fail-card"><div class="fail-num">1</div><div class="fail-text"><b>시장 성장률만 근거</b>로 고객문제를 충분히 확인하지 않은 아이템</div></div><div class="fail-card"><div class="fail-num">2</div><div class="fail-text">기존 대안과 차이가 <b>기능 1~2개 추가</b> 수준에 머무는 아이템</div></div><div class="fail-card"><div class="fail-num">3</div><div class="fail-text"><b>AI 사용 자체가 가치제안</b>이 되고 실제 문제 해결 역할이 불명확한 아이템</div></div><div class="fail-card"><div class="fail-num">4</div><div class="fail-text"><b>‘모든 반려인’</b>처럼 초기 고객 범위가 지나치게 넓은 아이템</div></div><div class="fail-card"><div class="fail-num">5</div><div class="fail-text">규제·전문가 판단이 핵심인데 이를 고려하지 않고 <b>바로 서비스화</b>하려는 아이템</div></div><div class="fail-card"><div class="fail-num">6</div><div class="fail-text">초기 데이터·시설·재고·전문가·파트너 없이는 <b>검증 자체가 어려운</b> 아이템</div></div><div class="fail-card wide"><div class="fail-num">7</div><div class="fail-text">고객이 기존 행동을 크게 바꿔야만 사용할 수 있어 <b>도입 장벽이 높은</b> 아이템</div></div>
</div></div><div class="insight-wrap" data-anim style="--i:4"><div class="insight">좋은 아이디어보다 먼저 확인할 것은 <span class="insight-main">문제의 구체성 · 기존 대안 대비 차이 · 실제 검증 가능성</span>입니다.</div></div>
</section>
