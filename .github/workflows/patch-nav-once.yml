name: Patch lecture nav labels once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add periods to sticky lecture nav labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '>1 시장·경쟁<': '>1. 시장·경쟁<',
              '>2 페인포인트<': '>2. 페인포인트<',
              '>3 아이템·가치<': '>3. 아이템·가치<',
              '>4 사업계획서<': '>4. 사업계획서<',
              '>5 MVP<': '>5. MVP<',
              '>6 제출<': '>6. 제출<',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected label: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-nav-once.yml
          git add index.html .github/workflows/patch-nav-once.yml
          git commit -m "Add periods to sticky lecture nav labels"
          git push
