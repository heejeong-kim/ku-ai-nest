name: Refine special lecture pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-special-lecture-pages.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine selected special lecture slides
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('special-lecture.html')
          s = p.read_text(encoding='utf-8')

          css_marker = '@keyframes shimmer'
          css = r'''
/* requested slide refinements */
.opp{grid-template-columns:170px 1fr;min-height:122px}.opp-area{font-size:15px;white-space:nowrap;letter-spacing:-.045em}.opp-case{font-size:12.8px}.opp-meta{font-size:11.5px}
.risk-card{position:relative;overflow:hidden}.risk-examples{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.risk-examples span{display:block;text-align:center;border-radius:999px;background:#fff3b0;color:#6f5900;padding:6px 7px;font-size:13.5px;font-weight:700;white-space:nowrap}.risk-card.dark .risk-examples span{background:rgba(245,196,0,.18);color:#ffe88a}
.priority{position:relative;padding:12px 16px;border-radius:22px;background:linear-gradient(90deg,#171717,#3b3108,#fff5b8);box-shadow:0 22px 54px -28px rgba(0,0,0,.35)}.priority span{border-color:rgba(255,255,255,.5);animation:priorityPulse 4.2s ease-in-out infinite}.priority span:nth-of-type(2){animation-delay:.45s}.priority span:nth-of-type(3){animation-delay:.9s}.priority span:nth-of-type(4){animation-delay:1.35s}.priority i{color:#ffe366;animation:priorityArrow 1.8s ease-in-out infinite}.source-table{table-layout:fixed}.source-table td:first-child,.source-table th:first-child{width:355px;white-space:nowrap}.source-table td,.source-table th{font-size:17px;padding:13px 16px}
.slide[data-part*="성장 사례"],.slide[data-part*="좌초 사례"]{background:radial-gradient(circle at 84% 16%,rgba(245,196,0,.18),transparent 28%),radial-gradient(circle at 14% 88%,rgba(49,90,216,.11),transparent 31%)}.slide[data-part*="성장 사례"] .s-head,.slide[data-part*="좌초 사례"] .s-head{border-bottom:1.5px solid rgba(120,100,0,.16);padding-bottom:16px}.slide[data-part*="성장 사례"] .kicker,.slide[data-part*="좌초 사례"] .kicker{color:#171717}.slide[data-part*="성장 사례"] .kicker:before,.slide[data-part*="좌초 사례"] .kicker:before{background:linear-gradient(90deg,var(--blue),var(--yellow))}.case-grid{grid-template-columns:.62fr 1.38fr}.case-brand,.fail-profile{border:0!important;background:linear-gradient(155deg,#171717,#3b3207)!important;color:#fff!important;box-shadow:0 30px 70px -34px rgba(0,0,0,.65)!important}.case-brand.blue{background:linear-gradient(155deg,#1b2b75,var(--blue))!important}.case-box,.fail-box{border-color:rgba(115,91,0,.16);box-shadow:0 18px 38px -28px rgba(0,0,0,.34)}.case-box.apply,.fail-apply{grid-column:1/-1;background:linear-gradient(135deg,#171717,#2c2507 58%,#594800)!important;border:0!important;color:#fff!important;padding:24px 28px!important;border-radius:22px!important;box-shadow:0 24px 58px -30px rgba(0,0,0,.62)!important}.case-box.apply h4,.fail-apply h4{color:#ffe36a!important;font-size:18px!important;letter-spacing:.02em}.case-box.apply p,.fail-apply p{color:#fff6cf!important;font-size:22px!important;line-height:1.45!important;font-weight:700}.fail-single{grid-template-columns:.54fr 1.46fr}.fail-detail{grid-template-columns:1fr 1fr}.fail-name{font-size:48px}.fail-fact{font-size:19px;line-height:1.5}.case-box p,.fail-box p{font-size:18px}.biz{table-layout:fixed}.biz th,.biz td{font-size:13.5px}.biz td:nth-child(1),.biz th:nth-child(1){width:145px;white-space:nowrap}.biz td:nth-child(2),.biz th:nth-child(2){width:135px;white-space:nowrap}.biz td:nth-child(3),.biz th:nth-child(3){width:430px;white-space:nowrap}.biz td:nth-child(4),.biz th:nth-child(4){width:auto}.hot{display:inline-block;border-radius:7px;background:#fff1a7;color:#6d5700;padding:1px 5px;font-weight:700}.risk{display:inline-block;border-radius:7px;background:#fff0ed;color:#b63d2f;padding:1px 5px;font-weight:700}.bluekey{display:inline-block;border-radius:7px;background:#e8edff;color:#315ad8;padding:1px 5px;font-weight:700}.close-title{animation:closeFloat 5.6s ease-in-out infinite}.close-title span{display:inline-block;animation:closeGlow 3.4s ease-in-out infinite}.close-sub{animation:closeSoftFloat 6.8s ease-in-out infinite}.qa span{display:inline-block;animation:qaPulse 2.2s ease-in-out infinite}
@keyframes priorityPulse{0%,100%{transform:translateY(0);box-shadow:none}50%{transform:translateY(-5px);box-shadow:0 10px 22px -14px rgba(0,0,0,.4)}}@keyframes priorityArrow{0%,100%{transform:translateX(0);opacity:.65}50%{transform:translateX(5px);opacity:1}}@keyframes closeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes closeGlow{0%,100%{text-shadow:0 0 0 rgba(245,196,0,0)}50%{text-shadow:0 12px 34px rgba(245,196,0,.36)}}@keyframes closeSoftFloat{0%,100%{transform:translateY(0);opacity:.86}50%{transform:translateY(-6px);opacity:1}}@keyframes qaPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
'''
          if 'requested slide refinements' not in s:
              if css_marker not in s:
                  raise SystemExit('CSS marker not found')
              s = s.replace(css_marker, css + '\n' + css_marker, 1)

          # Slide 7: add three examples to each risk card
          examples = {
              '성장률 착시': ['펫 커머스', '건강 앱', '동반 여행'],
              '기능 추가형 차별화': ['예약 기능', '리뷰 기능', '추천 기능'],
              'AI 목적화': ['AI 상담', 'AI 추천', 'AI 진단'],
              '초기 고객 범위 과다': ['모든 반려인', '전 연령 반려견', '전국 보호자'],
              '규제·전문가 판단 누락': ['진료 판단', '보험 비교', '영양 처방'],
              '검증 인프라 과다': ['하드웨어', '재고 상품', '병원 제휴'],
              '고객 행동 변화 과다': ['매일 기록', '새 기기 착용', '복잡한 입력'],
          }
          for title, vals in examples.items():
              pat = rf'(<article class="risk-card[^>]*>.*?<h3>{re.escape(title)}</h3><p>.*?</p>)(</article>)'
              def add_ex(m, vals=vals):
                  if 'risk-examples' in m.group(1):
                      return m.group(0)
                  chips = ''.join(f'<span>{v}</span>' for v in vals)
                  return m.group(1) + f'<div class="risk-examples">{chips}</div>' + m.group(2)
              s, n = re.subn(pat, add_ex, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Risk card not found: {title}')

          # Slide 9: add insight if missing
          source_section_pat = r'(<section class="slide" data-part="5\. 조사 출처".*?</div>)(</section>)'
          source_insight = '<div class="insight" data-anim style="--i:5">시장조사는 빠르게 많이 찾는 것보다 <span class="y">원출처에서 기준값을 먼저 확보</span>하고, 최신 변화는 보조자료로 검증해야 합니다</div>'
          m = re.search(source_section_pat, s, flags=re.S)
          if not m:
              raise SystemExit('source section not found')
          section = m.group(0)
          if '시장조사는 빠르게 많이 찾는 것보다' not in section:
              s = s[:m.start()] + m.group(1) + source_insight + m.group(2) + s[m.end():]

          # Slide 16: highlight important current status keywords
          replacements = {
              '적자 지속': '<span class="risk">적자 지속</span>',
              '영업손실 163억원': '<span class="risk">영업손실 163억원</span>',
              '지분 전량 매각': '<span class="risk">지분 전량 매각</span>',
              '신규 출점 재개': '<span class="hot">신규 출점 재개</span>',
              '매출 163억원': '<span class="hot">매출 163억원</span>',
              '흡수합병': '<span class="bluekey">흡수합병</span>',
              '업무협약': '<span class="bluekey">업무협약</span>',
              'A-벤처스 선정': '<span class="hot">A-벤처스 선정</span>',
              'API·SaaS': '<span class="bluekey">API·SaaS</span>',
          }
          for a,b in replacements.items():
              if b not in s:
                  s = s.replace(a,b)

          # Slide 16 insight
          biz_pat = r'(<section class="slide" data-part="8\. 주요 기업".*?</div>)(</section>)'
          biz_insight = '<div class="insight" data-anim style="--i:5">대표 기업 현황은 매출 규모만 보지 말고 <span class="y">적자·매각·제휴·재출점·SaaS 전환</span>처럼 현재 전략 변화의 키워드로 읽어야 합니다</div>'
          m = re.search(biz_pat, s, flags=re.S)
          if not m:
              raise SystemExit('biz section not found')
          if '대표 기업 현황은 매출 규모만 보지 말고' not in m.group(0):
              s = s[:m.start()] + m.group(1) + biz_insight + m.group(2) + s[m.end():]

          # Validate slide count
          count = len(re.findall(r'<section class="slide\b', s))
          if count != 17:
              raise SystemExit(f'Expected 17 slides, found {count}')

          p.write_text(s, encoding='utf-8')
          print('refined selected slides')
          PY
      - name: Commit refined slides
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-lecture.html
          git commit -m 'Refine special lecture slide layouts and motion'
          git push
