name: Hero pet motion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-pet-motion.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero visual and motion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css=""".hero-visual{position:absolute;z-index:1;right:max(32px,calc((100vw - 1520px)/2));top:50%;width:min(500px,36vw);aspect-ratio:16/9;transform:translateY(-50%);border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.92);box-shadow:0 30px 80px rgba(71,54,0,.2);background:#fff;transition:transform .2s ease,box-shadow .3s ease;will-change:transform}.hero-visual img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;image-rendering:auto}.hero-visual:after{content:\"\";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 42%,rgba(245,196,0,.10));pointer-events:none}.hero-visual:hover{box-shadow:0 38px 100px rgba(71,54,0,.28)}"""
          new_css=""".hero-visual{position:absolute;z-index:1;right:max(26px,calc((100vw - 1520px)/2));top:50%;width:min(610px,42vw);height:min(500px,56vh);transform:translateY(-50%);perspective:1100px;will-change:transform}.pet-card{position:absolute;overflow:hidden;border-radius:24px;border:1px solid rgba(255,255,255,.9);background:#fff;box-shadow:0 22px 58px rgba(71,54,0,.17);transition:box-shadow .25s ease;will-change:transform}.pet-card img{width:100%;height:100%;display:block;object-fit:cover;image-rendering:auto}.pet-card:after{content:\"\";position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.18),transparent 42%,rgba(245,196,0,.08));pointer-events:none}.pet-card.p1{width:66%;height:68%;right:2%;top:16%;z-index:3;animation:petFloat1 6.8s ease-in-out infinite}.pet-card.p2{width:42%;height:42%;left:0;top:2%;z-index:2;transform:rotate(-5deg);animation:petFloat2 7.8s ease-in-out infinite}.pet-card.p3{width:40%;height:40%;left:7%;bottom:0;z-index:4;transform:rotate(4deg);animation:petFloat3 8.6s ease-in-out infinite}.pet-card:hover{box-shadow:0 30px 80px rgba(71,54,0,.25)}@keyframes petFloat1{0%,100%{transform:translate3d(0,0,0) rotate(1deg)}50%{transform:translate3d(-7px,-14px,0) rotate(-1deg)}}@keyframes petFloat2{0%,100%{transform:translate3d(0,0,0) rotate(-5deg)}50%{transform:translate3d(8px,12px,0) rotate(-2deg)}}@keyframes petFloat3{0%,100%{transform:translate3d(0,0,0) rotate(4deg)}50%{transform:translate3d(-5px,-10px,0) rotate(1deg)}}.hero-copy>*{opacity:0;transform:translateY(22px);animation:heroReveal .72s cubic-bezier(.2,.7,.2,1) forwards}.hero-copy .eyebrow{animation-delay:.08s}.hero-copy h1{animation-delay:.18s}.hero-copy>p:not(.eyebrow){animation-delay:.3s}.hero-copy .hero-meta{animation-delay:.42s}.hero-copy .hero-actions{animation-delay:.54s}@keyframes heroReveal{to{opacity:1;transform:translateY(0)}}"""
          if old_css not in s: raise SystemExit('old hero css not found')
          s=s.replace(old_css,new_css,1)
          old_html='<section class="hero" id="hero"><div class="shell hero-inner"><p class="eyebrow">2026 KU CAMPUSTOWN · AI NEST</p><h1><span>M3 산업 특화 × AI</span><br>펫 분야 특화교육</h1><p>시장 데이터와 공식 통계를 근거로 펫 분야의 미충족 니즈를 발굴하고, 사업 아이템을 구체화한 뒤 웹 MVP까지 구현하는 4시간 집중 과정</p><div class="hero-meta"><span class="pill">13:00–17:00 · 240분</span><span class="pill">팀 단위 2~4인</span><span class="pill">Claude · Artifacts · Claude Code</span></div><div class="hero-actions"><a class="btn primary" href="#curriculum">커리큘럼 보기 ↓</a><a class="btn ghost" href="#special">특강 보기 →</a><a class="btn ghost" href="#lecture">강의교안 바로가기 →</a></div></div><div class="hero-visual" id="heroVisual"><img src="assets/hero-pet.jpg" alt="강아지와 비즈니스 문서, 노트북이 놓인 펫 비즈니스 업무 장면" width="720" height="405" decoding="async" fetchpriority="high"></div></section>'
          new_html='<section class="hero" id="hero"><div class="shell hero-inner hero-copy"><p class="eyebrow">2026 KU CAMPUSTOWN · AI NEST</p><h1><span>M3 산업 특화 × AI</span><br>펫 분야 특화교육</h1><p>시장 데이터와 공식 통계를 근거로 펫 분야의 미충족 니즈를 발굴하고, 사업 아이템을 구체화한 뒤 웹 MVP까지 구현하는 4시간 집중 과정</p><div class="hero-meta"><span class="pill">13:00–17:00 · 240분</span><span class="pill">팀 단위 2~4인</span><span class="pill">Claude · Artifacts · Claude Code</span></div><div class="hero-actions"><a class="btn primary" href="#curriculum">커리큘럼 보기 ↓</a><a class="btn ghost" href="#special">특강 보기 →</a><a class="btn ghost" href="#lecture">강의교안 바로가기 →</a></div></div><div class="hero-visual" id="heroVisual" aria-label="펫 비즈니스 비주얼"><div class="pet-card p1" data-depth="1"><img src="assets/pet1.png" alt="펫 비즈니스 이미지 1" decoding="async" fetchpriority="high"></div><div class="pet-card p2" data-depth="2"><img src="assets/pet2.png" alt="펫 비즈니스 이미지 2" decoding="async"></div><div class="pet-card p3" data-depth="3"><img src="assets/pet3.png" alt="펫 비즈니스 이미지 3" decoding="async"></div></div></section>'
          if old_html not in s: raise SystemExit('old hero html not found')
          s=s.replace(old_html,new_html,1)
          s=s.replace('.hero-inner>p,.hero-inner>h1,.hero-inner>.hero-meta,.hero-inner>.hero-actions{max-width:54%}', '.hero-inner>p,.hero-inner>h1,.hero-inner>.hero-meta,.hero-inner>.hero-actions{max-width:54%}',1)
          s=s.replace('.hero-visual{right:24px;width:min(430px,38vw)}','.hero-visual{right:18px;width:min(500px,42vw);height:430px}',1)
          s=s.replace('.hero-visual{top:auto;bottom:42px;left:50%;right:auto;width:min(92vw,520px);transform:translateX(-50%);border-radius:20px}', '.hero-visual{top:auto;bottom:28px;left:50%;right:auto;width:min(94vw,520px);height:290px;transform:translateX(-50%)}.pet-card.p1{width:62%;height:66%;right:2%;top:18%}.pet-card.p2{width:40%;height:40%;left:1%;top:4%}.pet-card.p3{width:38%;height:38%;left:9%;bottom:2%}',1)
          s=s.replace('@media(prefers-reduced-motion:reduce){.hero:before,.hero:after{animation:none}.hero-visual{transition:none}.float-nav a{transition:none}}','@media(prefers-reduced-motion:reduce){.hero:before,.hero:after,.pet-card,.hero-copy>*{animation:none!important}.hero-copy>*{opacity:1;transform:none}.hero-visual,.pet-card{transition:none!important}.float-nav a{transition:none}}',1)
          motion='''<script>\n(()=>{const hero=document.getElementById('hero');const visual=document.getElementById('heroVisual');if(!hero||!visual||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cards=[...visual.querySelectorAll('.pet-card')];hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();const nx=(e.clientX-r.left)/r.width-.5;const ny=(e.clientY-r.top)/r.height-.5;visual.style.transform=`translateY(-50%) rotateX(${(-ny*2.6).toFixed(2)}deg) rotateY(${(nx*3.2).toFixed(2)}deg)`;cards.forEach((card,i)=>{const d=(i+1)*2.2;card.style.translate=`${(nx*d).toFixed(1)}px ${(ny*d).toFixed(1)}px`;});});hero.addEventListener('pointerleave',()=>{visual.style.transform='translateY(-50%)';cards.forEach(c=>c.style.translate='');});})();\n</script>\n'''
          if motion not in s: s=s.replace('</body>',motion+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Animate hero with pet image collage'
          git push
