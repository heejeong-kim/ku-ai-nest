name: Update 2025 opportunity signal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-opportunity-signal-2025.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update 2025 signal data
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('special-lecture.html')
          s=p.read_text()
          old_card='''<article class="signal-card dark"><div class="year-tag dark">2024</div><div class="signal-eyebrow">반려동물 관련 영업장</div><div class="signal-value">23,565<small>개소</small></div><div class="delta">전년 대비 +14.5%</div><p class="signal-copy">같은 해 관련 종사자는 <b>29,305명</b>으로 전년 대비 <b>14.9%</b> 증가했습니다.</p></article>'''
          new_card='''<article class="signal-card dark"><div class="year-tag dark">2025</div><div class="signal-eyebrow">반려동물 관련 영업장</div><div class="signal-value">24,384<small>개소</small></div><div class="delta">전년 대비 +3.5%</div><p class="signal-copy">같은 해 관련 종사자는 <b>30,426명</b>으로 전년 대비 <b>3.8%</b> 증가했습니다.</p></article>'''
          old_source='''<a href="https://mafra.go.kr/bbs/home/792/574273/artclView.do" target="_blank" rel="noopener">농림축산검역본부·농림축산식품부, 2024년 반려동물 보호·복지 실태조사 결과(2025 공표)</a>'''
          new_source='''<a href="https://www.mafra.go.kr/bbs/home/792/578282/artclView.do?sicode=01" target="_blank" rel="noopener">농림축산식품부, 2025년 동물보호·복지 실태조사(2026 공표)</a>'''
          if s.count(old_card) != 1:
              raise SystemExit(f'old card count={s.count(old_card)}')
          if s.count(old_source) != 1:
              raise SystemExit(f'old source count={s.count(old_source)}')
          s=s.replace(old_card,new_card,1).replace(old_source,new_source,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-lecture.html
          git commit -m 'Update opportunity signal data to 2025'
          git push
