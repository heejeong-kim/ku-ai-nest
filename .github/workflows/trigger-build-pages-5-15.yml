name: Trigger special lecture pages 5-15
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-build-pages-5-15.yml'
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute embedded build script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          src=Path('.github/workflows/build-special-pages-5-15.yml').read_text()
          m=re.search(r"python - <<'PY'\n(.*?)\n          PY", src, re.S)
          if not m:
              raise SystemExit('embedded python not found')
          code=textwrap.dedent(m.group(1))
          exec(compile(code,'build-special-pages-5-15','exec'))
          PY
      - name: Commit generated deck
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-lecture.html
          git commit -m 'Build special lecture pages 5 through 15'
          git push
