name: Sync special lecture design
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-special-lecture-design.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Notion-aligned content and slide visual system
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('special-lecture.html')
          s=p.read_text(encoding='utf-8')

          marker='/* sync-grid-case-v2 */'
          css=r'''
/* sync-grid-case-v2 */
/* Common vertical grid: title area / body / bottom insight */
.slide:not(.cover):not(.close)>.s-head{min-height:154px;margin-bottom:0}
.slide:not(.cover):not(.close)>.s-body{justify-content:flex-start;padding-top:14px;padding-bottom:14px}
.slide:not(.cover):not(.close)>.insight{margin-top:0}

/* 6P investment taxonomy: card color = legend color */
.invest-card.healthcare{background:linear-gradient(145deg,#eef9f4,#fff);border-color:#b9dfcf}
.invest-card.healthcare:before{background:rgba(34,127,92,.12)}
.invest-card.healthcare .field{background:#dff4e9;color:#176548}
.invest-card.healthcare h3,.invest-card.healthcare b{color:#154f3c}
.invest-card.medai{background:linear-gradient(145deg,#eef2ff,#fff);border-color:#c9d4ff}
.invest-card.medai:before{background:rgba(49,90,216,.12)}
.invest-card.medai .field{background:#e1e8ff;color:#315ad8}
.invest-card.medai h3,.invest-card.medai b{color:#2749ad}
.invest-card.data{background:linear-gradient(145deg,#fff8cf,#fff);border-color:#ead68d}
.invest-card.data:before{background:rgba(245,196,0,.18)}
.invest-card.data .field{background:#fff0a8;color:#705800}
.invest-card.data h3,.invest-card.data b{color:#6a5400}
.invest-flow{margin-top:28px;padding-top:18px;border-top:1px solid #e9e3d1}
.invest-flow .healthcare{background:#dff4e9;color:#176548;border:1px solid #b9dfcf}
.invest-flow .medai{background:#e1e8ff;color:#315ad8;border:1px solid #c9d4ff}
.invest-flow .data{background:#fff0a8;color:#705800;border:1px solid #ead68d}

/* 11-16P case study family */
.case-slide{position:absolute}
.case-growth{background:radial-gradient(circle at 86% 12%,rgba(49,90,216,.16),transparent 28%),radial-gradient(circle at 10% 90%,rgba(34,127,92,.12),transparent 30%),linear-gradient(135deg,#f7fbff,#f7fcf9 58%,#eef4ff)}
.case-failure{background:radial-gradient(circle at 86% 12%,rgba(182,61,47,.14),transparent 28%),radial-gradient(circle at 10% 90%,rgba(91,48,40,.10),transparent 30%),linear-gradient(135deg,#fffafa,#fff5f2 58%,#f6f1ef)}
.case-growth .s-head{border-bottom-color:rgba(49,90,216,.22)}
.case-failure .s-head{border-bottom-color:rgba(182,61,47,.22)}
.case-growth .kicker{color:#315ad8}
.case-growth .kicker:before{background:linear-gradient(90deg,#315ad8,#2b8063)}
.case-failure .kicker{color:#a33d31}
.case-failure .kicker:before{background:linear-gradient(90deg,#7d3028,#d36c5f)}
.case-growth .case-profile,.case-growth .case-profile.blue{background:linear-gradient(155deg,#17345f,#1c655a)!important;color:#fff!important;border-color:transparent!important}
.case-growth .case-label{color:#9ee3c9}
.case-growth .case-tagline{color:#e5f7f0}
.case-growth .case-signals span{background:rgba(126,217,184,.14);color:#c8f4e3}
.case-failure .case-profile{background:linear-gradient(155deg,#321a17,#762f29)!important;color:#fff!important;border-color:transparent!important}
.case-failure .case-label{color:#ffb4a9}
.case-failure .case-tagline{color:#ffe2dd}
.case-failure .case-signals span{background:rgba(255,180,169,.13);color:#ffd8d2}
.case-failure .closed{background:#ffe2dd;color:#9e3328}
.case-slide .s-body{padding-top:10px;padding-bottom:0}
.case-slide .case-layout{height:100%;min-height:0}
.case-slide .case-profile{min-height:0;height:100%}
.case-slide .case-analysis{grid-template-rows:1fr 1fr auto;height:100%}
.case-slide .case-box{min-height:0}
/* Keep project application visually identical across all six case studies */
.case-slide .project-point{background:linear-gradient(90deg,#171717,#27396f);color:#fff}
.case-slide .project-point h4{color:var(--yellow)}
.case-slide .project-point p{color:#fff;font-size:22px}
'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)

          s=s.replace('동일 기준 재집계 공개자료는 확인되지 않아 누적 시장 진입 규모의 역사적 기준선으로 활용','2021년 당시 펫 스타트업의 활발한 시장 진입을 보여주는 지표')
          s=s.replace('조사기관·시점·모집단·집계방식이 달라 직접적인 생존율로 계산하지 않음','2025년 실제 매출이 확인되는 현재 활동 기업 풀')
          s=s.replace('<div class="snapshot-list"><div><b>144개+</b> — 2021년 시점 과거 투자유치 생태계가 어느 정도 형성됐는지 보여주는 진입 규모 신호</div><div><b>약 90개</b> — 2025년 매출이 확인되는 현재 기업 풀을 보여주는 최신 활동 신호</div></div><div class="snapshot-warn">두 수치는 직접 비교·연산하지 않고 과거 진입 규모와 현재 매출 확인 기업 풀을 각각 독립적으로 병기</div>', '<div class="snapshot-list"><div><b>① 과거 진입 규모</b> — 2021년 투자유치 펫 스타트업이 144개 이상 확인될 만큼 생태계가 형성</div><div><b>② 현재 활동 신호</b> — 2025년 실제 매출이 확인되는 기업 풀이 약 90개</div><div><b>③ 다음 확인</b> — 최근 투자와 신규 서비스가 어느 고객문제에 집중되는지 확인</div></div>')
          s=s.replace('스타트업 수는 하나의 정답이 아니라 <span class="y">집계 시점·기준·모집단</span>에 따라 달라지므로, 지표의 의미를 구분해서 해석해야 합니다','시장에 기업이 많다는 사실보다 지금 <span class="y">어떤 기업이 실제 매출을 만들고 있는지</span>, <span class="b">어느 문제영역으로 새로운 투자가 들어오는지</span> 확인하는 것이 중요합니다')

          reps={
            '<article class="invest-card dark"><span class="field">의약품</span><h3>펫팜</h3>':'<article class="invest-card medai"><span class="field">의약품</span><h3>펫팜</h3>',
            '<article class="invest-card blue"><span class="field">AI 홈케어</span><h3>십일리터</h3>':'<article class="invest-card healthcare"><span class="field">AI 홈케어</span><h3>십일리터</h3>',
            '<article class="invest-card"><span class="field">AI 진료보조</span><h3>메타디엑스</h3>':'<article class="invest-card medai"><span class="field">AI 진료보조</span><h3>메타디엑스</h3>',
            '<article class="invest-card"><span class="field">데이터</span><h3>비욘디</h3>':'<article class="invest-card data"><span class="field">데이터</span><h3>비욘디</h3>',
            '<article class="invest-card blue"><span class="field">헬스케어</span><h3>바로펫</h3>':'<article class="invest-card healthcare"><span class="field">헬스케어</span><h3>바로펫</h3>',
            '<article class="invest-card dark"><span class="field">스킨케어</span><h3>허레이</h3>':'<article class="invest-card healthcare"><span class="field">스킨케어</span><h3>허레이</h3>',
            '<div class="invest-flow" data-anim style="--i:4"><div>헬스케어</div><div>의약품·AI 진단</div><div>데이터 기반 관리</div></div>':'<div class="invest-flow" data-anim style="--i:4"><div class="healthcare">헬스케어</div><div class="medai">의약품·AI 진단</div><div class="data">데이터 기반 관리</div></div>'
          }
          for a,b in reps.items():
              if a not in s:
                  raise SystemExit('Missing investment target: '+a[:80])
              s=s.replace(a,b,1)

          s=s.replace('<section class="slide case-slide" data-part="6. 성장 사례"','<section class="slide case-slide case-growth" data-part="6. 성장 사례"')
          s=s.replace('<section class="slide case-slide" data-part="7. 좌초 사례"','<section class="slide case-slide case-failure" data-part="7. 좌초 사례"')
          s=s.replace('<aside class="case-profile blue"><div><div class="case-label">성장·시장검증 사례 2</div>','<aside class="case-profile"><div><div class="case-label">성장·시장검증 사례 2</div>',1)

          if s.count('case-growth') < 2 or s.count('case-failure') < 4:
              raise SystemExit('Case family classes not applied')
          if s.count('invest-card healthcare') != 3 or s.count('invest-card medai') != 2 or s.count('invest-card data') != 1:
              raise SystemExit('Investment taxonomy counts incorrect')
          if '두 수치는 직접 비교·연산하지 않고' in s or '동일 기준 재집계 공개자료는 확인되지 않아' in s:
              raise SystemExit('Author-facing ecosystem notes remain')
          if len(re.findall(r'<section class="slide\b',s)) != 18:
              raise SystemExit('Slide count changed unexpectedly')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-lecture.html
          git commit -m 'Sync special lecture case colors and grid'
          git push
# trigger 1
