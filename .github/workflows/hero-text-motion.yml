name: Hero text motion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-text-motion.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enhance hero text motion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=""".hero-copy>*{opacity:0;transform:translateY(22px);animation:heroReveal .72s cubic-bezier(.2,.7,.2,1) forwards}.hero-copy .eyebrow{animation-delay:.08s}.hero-copy h1{animation-delay:.18s}.hero-copy>p:not(.eyebrow){animation-delay:.3s}.hero-copy .hero-meta{animation-delay:.42s}.hero-copy .hero-actions{animation-delay:.54s}@keyframes heroReveal{to{opacity:1;transform:translateY(0)}}"""
          new=""".hero-copy>*{opacity:0;will-change:transform,opacity,filter}.hero-copy .eyebrow{transform:translateY(14px);filter:blur(5px);animation:heroEyebrow .7s cubic-bezier(.16,1,.3,1) .08s forwards}.hero-copy h1{transform:translateY(34px) scale(.985);filter:blur(8px);animation:heroTitle .95s cubic-bezier(.16,1,.3,1) .18s forwards}.hero-copy h1 span{background-size:0 100%;background-repeat:no-repeat;animation:heroHighlight .8s ease .8s forwards}.hero-copy>p:not(.eyebrow){transform:translateY(24px);filter:blur(5px);animation:heroRevealSoft .8s cubic-bezier(.16,1,.3,1) .45s forwards}.hero-copy .hero-meta{transform:translateY(20px);animation:heroRevealSoft .72s cubic-bezier(.16,1,.3,1) .62s forwards}.hero-copy .hero-actions{transform:translateY(18px);animation:heroRevealSoft .72s cubic-bezier(.16,1,.3,1) .78s forwards}.hero-copy .pill{transition:transform .22s ease,box-shadow .22s ease}.hero-copy .pill:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(91,72,0,.12)}.hero-copy .btn{transition:transform .22s ease,box-shadow .22s ease,background .22s ease}.hero-copy .btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.12)}@keyframes heroEyebrow{to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes heroTitle{0%{opacity:0;transform:translateY(34px) scale(.985);filter:blur(8px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes heroRevealSoft{to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes heroHighlight{to{background-size:100% 100%}}"""
          if old not in s:
              raise SystemExit('old hero text motion css not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enhance hero text entrance motion'
          git push
