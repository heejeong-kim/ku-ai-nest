name: Add market data slide
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-market-data-slide.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add first market data content slide
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('special-lecture.html')
          s=p.read_text()

          css = r'''
/* ---------- market data slide ---------- */
.market-data{display:grid;grid-template-columns:1.04fr 1fr;gap:24px;align-items:stretch}
.market-hero-stat{position:relative;overflow:hidden;border-radius:28px;background:#171717;color:#fff;padding:34px 36px;box-shadow:0 28px 58px -26px rgba(0,0,0,.48);min-height:418px;display:flex;flex-direction:column;justify-content:space-between}
.market-hero-stat::after{content:"";position:absolute;right:-96px;top:-96px;width:260px;height:260px;border-radius:50%;background:rgba(245,196,0,.2);filter:blur(4px)}
.stat-label{font-size:20px;font-weight:700;color:var(--yellow);letter-spacing:.04em}
.stat-main{font-size:82px;font-weight:700;line-height:1.04;letter-spacing:-.055em;margin-top:18px}
.stat-main small{font-size:31px;font-weight:700;color:#f6e6a0;margin-left:7px}
.stat-desc{font-size:23px;line-height:1.5;color:#eee3b0;margin-top:18px;word-break:keep-all}
.market-chart{margin-top:30px;display:grid;gap:15px}
.bar-row{display:grid;grid-template-columns:78px 1fr 72px;align-items:center;gap:14px;font-size:18px;font-weight:700;color:#fff}
.bar-track{height:20px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--yellow),#ffe36a);box-shadow:0 0 22px rgba(245,196,0,.28);transform-origin:left;animation:barGrow 1.1s cubic-bezier(.16,1,.3,1) both}
.bar-row:nth-child(2) .bar-fill{animation-delay:.15s}
.market-metrics{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.metric-card{background:#fff;border:1.5px solid var(--yellow-line);border-radius:22px;padding:24px 24px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;justify-content:space-between;min-height:192px}
.metric-card.hl{background:linear-gradient(160deg,var(--yellow-50),#fff);border-color:var(--yellow-600)}
.metric-k{font-size:16px;font-weight:700;color:var(--yellow-700);letter-spacing:.05em;text-transform:uppercase}
.metric-v{font-size:43px;font-weight:700;letter-spacing:-.045em;line-height:1.05;margin-top:13px;color:var(--ink)}
.metric-v small{font-size:20px;color:var(--muted);font-weight:700;margin-left:4px}
.metric-d{font-size:18px;line-height:1.43;color:var(--ink-2);margin-top:12px;word-break:keep-all}
.trend-flow{margin-top:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flow-step{position:relative;background:#fff;border:1.5px solid var(--yellow-line);border-radius:18px;padding:18px 18px;box-shadow:var(--shadow-sm);font-size:19px;font-weight:700;line-height:1.35;color:var(--ink);word-break:keep-all;text-align:center}
.flow-step:not(:last-child)::after{content:"→";position:absolute;right:-16px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--yellow-700);font-weight:700;z-index:2}
.source-note{margin-top:16px;font-size:15px;line-height:1.55;color:var(--muted);word-break:keep-all}
.source-note a{color:var(--yellow-700);text-decoration:none;border-bottom:1px solid rgba(169,130,0,.35)}
@keyframes barGrow{from{transform:scaleX(.08);opacity:.3}to{transform:scaleX(1);opacity:1}}
'''
          marker='/* ---------- cover ---------- */'
          if css.strip() not in s:
              if marker not in s:
                  raise SystemExit('cover css marker not found')
              s=s.replace(marker, css+'\n'+marker, 1)

          new_slides = r'''const SLIDES=[
  {
    part:'표지',
    menu:'표지 · 펫 산업 특강',
    type:'cover'
  },
  {
    part:'1. 산업 동향',
    menu:'1. 핵심 산업 동향·시장 데이터',
    type:'content',
    kicker:'MARKET DATA',
    title:'핵심 산업 동향·시장 데이터',
    sub:'2024~2026 공표 자료로 보는 반려동물 산업의 현재 위치',
    insight:'반려동물 산업은 단순 용품 판매가 아니라 <b>양육가구 확대 → 반복 지출 증가 → 의료·미용·돌봄 서비스 이용 확대 → 관련 영업·인력 증가</b>로 이어지는 생활서비스 산업으로 확장되고 있습니다.',
    body:`
      <div class="market-data" data-anim style="--i:0">
        <section class="market-hero-stat">
          <div>
            <div class="stat-label">MARKET SIZE</div>
            <div class="stat-main">75억 → 169억<small>달러</small></div>
            <p class="stat-desc">국내 반려동물 연관산업 시장은 2024년 75억 달러에서 2034년 169억 달러까지 성장할 것으로 전망됩니다.</p>
          </div>
          <div class="market-chart" aria-label="국내 반려동물 연관산업 시장 규모 전망">
            <div class="bar-row"><span>2024</span><div class="bar-track"><div class="bar-fill" style="width:44%"></div></div><span>75억</span></div>
            <div class="bar-row"><span>2034</span><div class="bar-track"><div class="bar-fill" style="width:100%"></div></div><span>169억</span></div>
          </div>
        </section>
        <section class="market-metrics">
          <article class="metric-card hl"><div><div class="metric-k">HOUSEHOLD</div><div class="metric-v">29.2<small>%</small></div></div><p class="metric-d">현재 거주지에서 반려동물을 직접 양육하는 가구 비율</p></article>
          <article class="metric-card"><div><div class="metric-k">HOSPITAL USE</div><div class="metric-v">95.1<small>%</small></div></div><p class="metric-d">최근 1년 이내 동물병원 이용 경험</p></article>
          <article class="metric-card"><div><div class="metric-k">MONTHLY COST</div><div class="metric-v">12.1<small>만원</small></div></div><p class="metric-d">반려동물 1마리당 월평균 양육비</p></article>
          <article class="metric-card"><div><div class="metric-k">REGISTERED PETS</div><div class="metric-v">367.6<small>만</small></div></div><p class="metric-d">2025년 누적 등록 반려동물 수</p></article>
        </section>
      </div>
      <div class="trend-flow" data-anim style="--i:1">
        <div class="flow-step">양육가구 확대</div>
        <div class="flow-step">반복 지출 증가</div>
        <div class="flow-step">의료·미용·돌봄 이용 확대</div>
        <div class="flow-step">영업·인력 기반 증가</div>
      </div>
      <p class="source-note" data-anim style="--i:2">출처: 농림축산식품부, 「반려동물 연관산업의 육성 및 지원에 관한 법률」 제정 관련 보도자료(2026), 「2025년 반려동물 양육현황조사」(2026 공표), 「2025년 동물보호·복지 실태조사」(2026 공표)</p>`
  }
];'''
          s2,n=re.subn(r"const SLIDES=\[.*?\];", new_slides, s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit(f'SLIDES replacement count={n}')
          p.write_text(s2)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add special-lecture.html
          git commit -m 'Add market data slide to special lecture deck'
          git push
