name: Refine curriculum table
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-curriculum-table.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine curriculum table layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''<div class="card schedule"><div class="table-wrap"><table class="data-table"><thead><tr><th>시간</th><th>소요</th><th>구성</th><th>작업 내용</th></tr></thead><tbody><tr><td>13:00–13:10</td><td>10분</td><td><b>오리엔테이션</b></td><td>2회차 산출물 점검, 팀별 역할 분담, 진행 방식 확인</td></tr><tr><td>13:10–13:45</td><td>35분</td><td><b>특강</b></td><td>펫 산업 핵심 동향·기회영역·실패유형·진입조건·데이터 출처 확인</td></tr><tr><td>13:45–14:10</td><td>25분</td><td><b>1. 시장·트렌드·경쟁사 분석</b></td><td>아이디어·시장 구조화 → 시장·트렌드·기회영역 조사 → 직접·간접 경쟁과 비소비 대안 비교 → 다음 단계 페인포인트 후보 도출</td></tr><tr><td>14:10–14:35</td><td>25분</td><td><b>2. 공식데이터 기반 고객 니즈·페인포인트 검증</b></td><td>1단계에서 도출한 페인포인트 후보를 공식통계·공공데이터로 검증하고 문제의 존재·규모·빈도·대상 고객·손실 근거를 정리</td></tr><tr><td>14:35–14:45</td><td>10분</td><td><b>3. 최종 아이템 확정·가치제안</b></td><td>검증된 핵심 페인포인트 1개를 기준으로 최종 사업 아이템 1개와 핵심 고객·사용 상황·해결방식·가치제안을 확정</td></tr><tr><td>14:45–15:20</td><td>35분</td><td><b>4. 사업계획서 핵심항목·초안 작성</b></td><td>브레이크 10분 후 1~3단계 결과를 바꾸지 않고 문제 → 근거 → 솔루션 → 타겟 → 비즈니스모델 흐름으로 사업계획서 핵심 초안을 작성</td></tr><tr><td>15:20–16:45</td><td>85분</td><td><b>5. AI 기반 서비스 콘셉트·웹 MVP 구현</b></td><td>MVP 검증 가설·핵심 기능 3개·유저 플로우·AI 역할 정의 → AI 포함 PRD 작성 → Claude Code로 실제 작동하는 웹 MVP 구현 → 필요 시 Google Sheets·Apps Script 연동</td></tr><tr><td>16:45–17:00</td><td>15분</td><td><b>6. 최종 산출물 정리·제출</b></td><td>사업계획서·AI 웹 MVP·핵심 근거와 검증 결과를 하나의 제출 패키지로 정리하고 타겟 고객·핵심 문제·가치제안·MVP 가설·링크 작동 여부를 최종 확인</td></tr><tr><td>17:00</td><td>—</td><td><b>마무리</b></td><td>제출 여부 확인 및 후속 안내</td></tr></tbody></table></div></div>'''
          new='''<div class="card schedule"><div class="table-wrap"><table class="data-table curriculum-table"><colgroup><col class="col-time"><col class="col-duration"><col class="col-stage"><col class="col-work"></colgroup><thead><tr><th>시간</th><th>소요</th><th>구성</th><th>작업 내용</th></tr></thead><tbody><tr><td>13:00–13:10</td><td>10분</td><td><b>오리엔테이션</b></td><td><ul class="task-list"><li>2회차 산출물 점검</li><li>팀별 역할 분담</li><li>진행 방식 확인</li></ul></td></tr><tr><td>13:10–13:45</td><td>35분</td><td><b>특강</b></td><td><ul class="task-list"><li>펫 산업 핵심 동향 확인</li><li>기회영역·실패유형·진입조건 확인</li><li>시장조사에 사용할 데이터 출처 확인</li></ul></td></tr><tr><td>13:45–14:10</td><td>25분</td><td><b>1. 시장·트렌드·경쟁사 분석</b></td><td><ul class="task-list"><li>아이디어·시장 구조화</li><li>시장·트렌드·기회영역 조사</li><li>직접·간접 경쟁과 비소비 대안 비교</li><li>다음 단계 페인포인트 후보 도출</li></ul></td></tr><tr><td>14:10–14:35</td><td>25분</td><td><b>2. 공식데이터 기반 고객 니즈·페인포인트 검증</b></td><td><ul class="task-list"><li>1단계에서 도출한 페인포인트 후보를 공식통계·공공데이터로 검증</li><li>문제의 존재·규모·빈도 확인</li><li>대상 고객과 비용·시간·불안 등 손실 근거 정리</li></ul></td></tr><tr><td>14:35–14:45</td><td>10분</td><td><b>3. 최종 아이템 확정·가치제안</b></td><td><ul class="task-list"><li>검증된 핵심 페인포인트 1개 확정</li><li>최종 사업 아이템 1개 확정</li><li>핵심 고객·사용 상황·해결방식 정리</li><li>한 문장의 가치제안 확정</li></ul></td></tr><tr><td>14:45–15:20</td><td>35분</td><td><b>4. 사업계획서 핵심항목·초안 작성</b></td><td><ul class="task-list"><li>브레이크 10분</li><li>1~3단계 결과를 유지해 사업계획서 핵심 초안 작성</li><li>문제 → 근거 → 솔루션 → 타겟 → 비즈니스모델 흐름 연결</li></ul></td></tr><tr><td>15:20–16:45</td><td>85분</td><td><b>5. AI 기반 서비스 콘셉트·웹 MVP 구현</b></td><td><ul class="task-list"><li>MVP 검증 가설·핵심 기능 3개·유저 플로우·AI 역할 정의</li><li>AI 포함 PRD 작성</li><li>Claude Code로 실제 작동하는 웹 MVP 구현</li><li>필요 시 Google Sheets·Apps Script 연동</li></ul></td></tr><tr><td>16:45–17:00</td><td>15분</td><td><b>6. 최종 산출물 정리·제출</b></td><td><ul class="task-list"><li>사업계획서·AI 웹 MVP·핵심 근거와 검증 결과를 제출 패키지로 정리</li><li>타겟 고객·핵심 문제·가치제안·MVP 가설의 일치 여부 확인</li><li>MVP 링크와 데이터 저장 기능의 실제 작동 여부 확인</li></ul></td></tr><tr><td>17:00</td><td>—</td><td><b>마무리</b></td><td><ul class="task-list"><li>제출 여부 확인</li><li>후속 안내</li></ul></td></tr></tbody></table></div></div>'''
          if old not in s:
              raise SystemExit('curriculum table not found')
          s=s.replace(old,new,1)
          marker='.schedule{margin-top:18px;overflow:hidden}.source-list{font-size:16px;color:var(--muted)}'
          repl='.schedule{margin-top:18px;overflow:hidden}.curriculum-table{table-layout:fixed;min-width:1320px}.curriculum-table .col-time{width:170px}.curriculum-table .col-duration{width:90px}.curriculum-table .col-stage{width:470px}.curriculum-table .col-work{width:auto}.curriculum-table th:nth-child(-n+3),.curriculum-table td:nth-child(-n+3){white-space:nowrap}.task-list{margin:0;padding-left:22px}.task-list li{margin:2px 0}.source-list{font-size:16px;color:var(--muted)}'
          if marker not in s:
              raise SystemExit('schedule css marker not found')
          s=s.replace(marker,repl,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve curriculum table readability'
          git push
