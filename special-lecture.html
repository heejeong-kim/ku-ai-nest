<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>펫 산업 특강 · 시장을 문제와 기회 관점으로 보기</title>
</head>
<body>
<script>
(async()=>{
  const response=await fetch('./special-lecture-original.html?v=20260829-layoutfix2');
  if(!response.ok) throw new Error('발표자료 원본을 불러오지 못했습니다.');
  let html=await response.text();
  const fix=`<style>
/* 3페이지 레이아웃 보정 */
.slide:nth-of-type(3) > .s-head{
  margin-bottom:34px!important;
  position:relative;
  z-index:3;
}
.slide:nth-of-type(3) > .s-body{
  justify-content:flex-start!important;
  position:relative;
  z-index:1;
}

/* 3페이지 하단 업종 차트 높이 축소 */
.slide:nth-of-type(3) > .s-body > .panel{
  margin-top:12px!important;
  padding:16px 24px 18px!important;
}
.slide:nth-of-type(3) .mix{
  padding:0 12px!important;
  gap:22px!important;
}
.slide:nth-of-type(3) .mix-row{
  gap:6px 10px!important;
}
.slide:nth-of-type(3) .mix-track{
  height:140px!important;
  border-radius:12px 12px 7px 7px!important;
}
.slide:nth-of-type(3) .mix-fill{
  border-radius:10px 10px 5px 5px!important;
}
.slide:nth-of-type(3) .mix-row:nth-child(1) .mix-fill{height:44.5%!important;}
.slide:nth-of-type(3) .mix-row:nth-child(2) .mix-fill{height:23.8%!important;}
.slide:nth-of-type(3) .mix-row:nth-child(3) .mix-fill{height:11.4%!important;}
.slide:nth-of-type(3) .source{
  margin-top:8px!important;
}
</style>`;
  html=html.replace('</head>',fix+'</head>');
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<main style="font-family:sans-serif;padding:40px"><h1>발표자료를 불러오지 못했습니다.</h1><p>'+err.message+'</p></main>';
});
</script>
</body>
</html>
