<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>펫 산업 특강 · 시장을 문제와 기회 관점으로 보기</title>
</head>
<body>
<script>
(async()=>{
  const response=await fetch('./special-lecture-original.html?v=20260829-layoutfix1');
  if(!response.ok) throw new Error('발표자료 원본을 불러오지 못했습니다.');
  let html=await response.text();
  const fix=`<style>
/* 3페이지 레이아웃 보정: 서브 텍스트와 본문 카드 겹침 방지 */
.slide:nth-of-type(3) > .s-head{margin-bottom:46px!important;position:relative;z-index:3;}
.slide:nth-of-type(3) > .s-body{justify-content:flex-start!important;position:relative;z-index:1;}
</style>`;
  html=html.replace('</head>',fix+'</head>');
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<main style="font-family:sans-serif;padding:40px"><h1>발표자료를 불러오지 못했습니다.</h1><p>'+err.message+'</p></main>';
});
</script>
</body>
</html>
