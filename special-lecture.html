<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>펫 산업 특강 · 시장을 문제와 기회 관점으로 보기</title>
<meta name="description" content="2026 KU 캠퍼스타운 AI Nest · M3 산업 특화 × AI 펫 분야 특강 발표자료">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#f5c400;
  --yellow-500:#f5c400;
  --yellow-600:#d8aa00;
  --yellow-700:#a98200;
  --yellow-50:#fffbed;
  --yellow-100:#fff5bd;
  --yellow-line:#eadb8f;
  --ink:#171717;
  --ink-2:#403d35;
  --muted:#817b6c;
  --muted-2:#aaa28f;
  --paper:#fffef9;
  --paper-2:#fbf8ee;
  --card:#fff;
  --card-soft:#faf7ed;
  --shadow:0 18px 48px -20px rgba(88,69,0,.24),0 6px 18px -10px rgba(88,69,0,.14);
  --shadow-sm:0 10px 26px -16px rgba(88,69,0,.26);
  --DW:1280px;
  --DH:905px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
  background:var(--paper);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a{font:inherit}
#bg-lines{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:linear-gradient(135deg,#fffef9,#fffaf0 58%,#fff6c9)}
.stage{position:fixed;inset:0;z-index:1;overflow:hidden}
.deck{width:var(--DW);height:var(--DH);position:absolute;top:50%;left:50%;transform-origin:center center}
.slide{
  position:absolute;inset:0;padding:52px 78px 40px;display:flex;flex-direction:column;
  opacity:0;transform:translateX(46px) scale(.995);
  transition:opacity .5s ease,transform .55s cubic-bezier(.22,.61,.36,1);
  pointer-events:none
}
.slide.is-active{opacity:1;transform:none;pointer-events:auto;z-index:2}
.slide.is-leaving-left{opacity:0;transform:translateX(-46px) scale(.995);z-index:1}
[data-anim]{opacity:0;transform:translateY(26px);transition:opacity .6s cubic-bezier(.22,.61,.36,1),transform .6s cubic-bezier(.22,.61,.36,1)}
.reveal [data-anim],[data-anim].reveal{opacity:1;transform:none;transition-delay:calc(var(--i,0)*68ms + 100ms)}
.frag{opacity:0;transform:translateY(18px);transition:opacity .45s ease,transform .55s cubic-bezier(.22,.61,.36,1)}
.frag.is-shown{opacity:1;transform:none}

/* ---------- reusable slide layout ---------- */
.kicker{font-size:19px;font-weight:700;letter-spacing:.14em;color:var(--yellow-700);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:34px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--yellow-700),var(--yellow))}
.s-emoji{font-size:40px;line-height:1;margin-bottom:8px}
.s-title{font-size:41px;font-weight:700;line-height:1.24;letter-spacing:-.035em;color:var(--ink);word-break:keep-all}
.s-title .hl{color:var(--yellow-700)}
.s-sub{font-size:22px;font-weight:500;color:var(--muted);margin-top:12px;line-height:1.45;word-break:keep-all}
.s-head{margin-bottom:26px}
.s-head.tight{margin-bottom:18px}
.s-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:18px}
.insight-wrap{margin-top:24px}
.insight{position:relative;background:linear-gradient(90deg,var(--yellow-50),#fff);border:1.5px solid var(--yellow-line);border-left:5px solid var(--yellow);border-radius:16px;padding:20px 28px 20px 58px;font-size:23px;font-weight:700;color:var(--ink-2);line-height:1.4;word-break:keep-all;box-shadow:var(--shadow-sm);animation:floatSoft 5.6s ease-in-out infinite;will-change:transform}
.insight::before{content:"\201C";position:absolute;left:20px;top:8px;font-size:52px;line-height:1;color:var(--yellow-600);opacity:.52;font-family:Georgia,serif}
.cards{display:grid;gap:20px}
.cards--2{grid-template-columns:repeat(2,1fr)}
.cards--3{grid-template-columns:repeat(3,1fr)}
.cards--4{grid-template-columns:repeat(2,1fr)}
.card{position:relative;background:var(--card);border:1.5px solid var(--yellow-line);border-radius:20px;padding:26px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:9px}
.card--hl{background:linear-gradient(160deg,var(--yellow-50),#fff);border-color:var(--yellow-600);box-shadow:var(--shadow)}
.card__num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--yellow-100);color:var(--yellow-700);font-weight:700;font-size:21px;margin-bottom:4px}
.card__icon{font-size:34px;line-height:1;margin-bottom:2px}
.card__label{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--yellow-700);text-transform:uppercase}
.card__title{font-size:23px;font-weight:700;color:var(--ink);line-height:1.32;word-break:keep-all}
.card__desc{font-size:19px;font-weight:500;color:var(--ink-2);line-height:1.5;word-break:keep-all}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:20px;background:#fff;border:1.5px solid var(--yellow-line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm)}
.tbl thead th{font-size:18px;font-weight:700;color:var(--yellow-700);text-align:left;padding:16px 22px;background:var(--yellow-50);border-bottom:2px solid var(--yellow-line)}
.tbl tbody td{padding:16px 22px;border-bottom:1px solid #f1ead0;color:var(--ink-2);font-weight:500;line-height:1.4;vertical-align:middle;word-break:keep-all}
.tbl tbody tr:last-child td{border-bottom:none}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch}
.col{background:var(--card);border:1.5px solid var(--yellow-line);border-radius:20px;padding:26px 28px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px;height:100%}
.col--hl{background:linear-gradient(160deg,var(--yellow-50),#fff);border-color:var(--yellow-600);box-shadow:var(--shadow)}
.col__icon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--yellow-100)}
.col__title{font-size:24px;font-weight:700;color:var(--ink)}
.col__sub{font-size:17px;color:var(--muted);line-height:1.4;margin-top:-4px;word-break:keep-all}
.col__list{list-style:none;display:flex;flex-direction:column;gap:11px;margin-top:4px}
.col__list li{position:relative;padding-left:24px;font-size:20px;color:var(--ink-2);line-height:1.4;word-break:keep-all}
.col__list li::before{content:"";position:absolute;left:2px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--yellow-600)}

/* ---------- cover ---------- */
.slide.s-cover{align-items:center;justify-content:center;text-align:center;padding:60px 76px}
.cover-kicker{font-size:18px;font-weight:700;letter-spacing:.18em;color:var(--yellow-700);margin-bottom:24px;text-transform:uppercase}
.cover-title{font-size:92px;font-weight:700;letter-spacing:-.055em;line-height:1.03}
.ct-inner{display:inline-block;background:linear-gradient(110deg,#171717 0%,#7b6500 24%,#d2a500 44%,#171717 66%,#8d7200 82%,#171717 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ctShimmer 8s linear infinite,ctFloat 5s ease-in-out infinite;will-change:transform,background-position}
.cover-sub{font-size:34px;font-weight:600;color:var(--ink-2);margin-top:22px;letter-spacing:-.025em}
.cover-rule{width:126px;height:3px;background:linear-gradient(90deg,transparent,var(--yellow),transparent);margin:34px auto}
.cover-program{font-size:24px;font-weight:700;color:var(--ink)}
.cover-meta{font-size:19px;color:var(--muted);margin-top:9px;font-weight:500}
.cover-quote-wrap{margin-top:42px}
.cover-quote{max-width:930px;font-size:23px;font-weight:700;color:#5e4a00;background:rgba(255,248,205,.8);border:1.5px solid var(--yellow-line);border-radius:16px;padding:20px 34px;line-height:1.5;word-break:keep-all;box-shadow:var(--shadow-sm);animation:floatSoft 5.2s ease-in-out infinite;will-change:transform}
.cover-paw{position:absolute;font-size:66px;opacity:.055;filter:grayscale(1);user-select:none;pointer-events:none;animation:pawFloat 7s ease-in-out infinite}
.cover-paw.p1{left:88px;top:104px;transform:rotate(-18deg)}
.cover-paw.p2{right:112px;bottom:108px;transform:rotate(16deg);animation-delay:-2.8s}
.cover-paw.p3{right:170px;top:126px;font-size:42px;transform:rotate(8deg);animation-delay:-4.4s}

/* ---------- divider ---------- */
.slide.s-divider{align-items:flex-start;justify-content:center;text-align:left;padding:80px 96px}
.slide.s-divider .ghost{position:absolute;right:70px;bottom:20px;font-size:280px;font-weight:700;line-height:.8;color:#fff6cc;z-index:-1;letter-spacing:-.04em;user-select:none}
.div-kicker{font-size:22px;font-weight:700;letter-spacing:.24em;color:var(--yellow-700);margin-bottom:22px;display:flex;align-items:center;gap:14px}
.div-kicker::before{content:"";width:52px;height:4px;border-radius:4px;background:var(--yellow)}
.div-title{font-size:56px;font-weight:700;line-height:1.2;letter-spacing:-.035em;color:var(--ink);max-width:1000px;word-break:keep-all}
.div-title .hl{background:linear-gradient(120deg,var(--yellow-700),var(--yellow-500));-webkit-background-clip:text;background-clip:text;color:transparent}
.div-sub{font-size:24px;font-weight:600;color:var(--muted);margin-top:26px}

/* ---------- chrome ---------- */
.back{position:fixed;top:20px;left:22px;z-index:40;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);box-shadow:0 8px 22px -12px rgba(88,69,0,.35);border:1px solid rgba(126,101,0,.12);color:var(--ink-2);text-decoration:none;font-size:13px;font-weight:700;transition:transform .2s,background .2s}
.back:hover{background:#fff;transform:translateY(-2px)}
.nav-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:20;width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);box-shadow:0 10px 30px -10px rgba(88,69,0,.38);display:grid;place-items:center;color:var(--yellow-700);transition:transform .2s,background .2s,opacity .2s}
.nav-arrow:hover{background:#fff;transform:translateY(-50%) scale(1.08);color:#6d5700}
.nav-arrow:active{transform:translateY(-50%) scale(.96)}
.nav-arrow svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav-arrow.prev{left:26px}.nav-arrow.next{right:26px}
.nav-arrow[disabled]{opacity:.28;cursor:default;pointer-events:none}
.hamburger{position:fixed;top:20px;right:22px;z-index:40;width:42px;height:42px;border-radius:12px;border:none;cursor:pointer;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);box-shadow:0 8px 22px -12px rgba(88,69,0,.35);display:grid;place-items:center;align-content:center;transition:transform .2s,background .2s}
.hamburger:hover{background:#fff;transform:scale(1.06)}
.hamburger span{display:block;width:19px;height:2.5px;border-radius:3px;background:var(--yellow-700);margin:2.5px 0;transition:transform .3s,opacity .2s}
body.menu-open .hamburger span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
body.menu-open .hamburger span:nth-child(2){opacity:0}
body.menu-open .hamburger span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--yellow-700),var(--yellow));z-index:30;width:0;transition:width .4s cubic-bezier(.22,.61,.36,1)}
.counter{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-radius:999px;padding:9px 20px;font-size:16px;font-weight:700;color:var(--yellow-700);letter-spacing:.04em;box-shadow:0 8px 24px -12px rgba(88,69,0,.35);display:flex;align-items:center;gap:8px}
.counter .cur{font-size:18px}.counter .tot{color:var(--muted-2)}
.scrim{position:fixed;inset:0;background:rgba(35,30,14,.32);backdrop-filter:blur(2px);z-index:35;opacity:0;pointer-events:none;transition:opacity .3s}
body.menu-open .scrim{opacity:1;pointer-events:auto}
.menu{position:fixed;top:0;right:0;width:min(420px,88vw);height:100%;z-index:38;background:rgba(255,254,249,.98);box-shadow:-20px 0 60px -28px rgba(55,44,0,.34);padding:82px 24px 28px;transform:translateX(102%);transition:transform .38s cubic-bezier(.22,.61,.36,1);overflow:auto}
body.menu-open .menu{transform:none}
.menu-head{padding:0 10px 18px;border-bottom:1px solid var(--yellow-line)}
.menu-head strong{display:block;font-size:22px;letter-spacing:-.02em}.menu-head span{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
.menu-group{padding:18px 0 4px}.menu-part{padding:0 10px 7px;font-size:12px;font-weight:700;letter-spacing:.13em;color:var(--yellow-700);text-transform:uppercase}
.menu-item{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:var(--ink-2);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.menu-item:hover,.menu-item.is-active{background:var(--yellow-50);color:var(--ink)}
.menu-item.is-active{font-weight:700}

@keyframes ctShimmer{from{background-position:0 50%}to{background-position:260% 50%}}
@keyframes ctFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(-.35deg)}}
@keyframes floatSoft{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pawFloat{0%,100%{translate:0 0}50%{translate:0 -10px}}

@media(max-width:760px){
  .back{top:12px;left:12px}.hamburger{top:12px;right:12px}
  .nav-arrow{width:48px;height:48px}.nav-arrow.prev{left:10px}.nav-arrow.next{right:10px}
  .counter{bottom:12px;padding:7px 14px;font-size:14px}.counter .cur{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  [data-anim]{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<canvas id="bg-lines" aria-hidden="true"></canvas>
<a class="back" href="index.html#special">← 본문으로</a>

<div class="stage" id="stage">
  <main class="deck" id="deck" aria-live="polite"></main>
</div>

<button class="nav-arrow prev" id="prev" type="button" aria-label="이전 슬라이드">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<button class="nav-arrow next" id="next" type="button" aria-label="다음 슬라이드">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
</button>

<button class="hamburger" id="menuToggle" type="button" aria-label="슬라이드 목차 열기" aria-expanded="false">
  <span></span><span></span><span></span>
</button>
<div class="scrim" id="scrim"></div>
<aside class="menu" id="menu" aria-label="슬라이드 목차">
  <div class="menu-head"><strong>펫 산업 특강</strong><span>시장을 문제와 기회 관점으로 보기</span></div>
  <div id="menuList"></div>
</aside>

<div class="progress" id="progress"></div>
<div class="counter" id="counter"><span class="cur">01</span><span>/</span><span class="tot">01</span></div>

<script>
const SLIDES=[
  {
    part:'표지',
    menu:'표지 · 펫 산업 특강',
    type:'cover'
  }
];

function coverSlide(){
  return `
    <section class="slide s-cover is-active">
      <span class="cover-paw p1" aria-hidden="true">🐾</span>
      <span class="cover-paw p2" aria-hidden="true">🐾</span>
      <span class="cover-paw p3" aria-hidden="true">🐾</span>
      <p class="cover-kicker" data-anim style="--i:0">2026 KU CAMPUSTOWN · AI NEST</p>
      <h1 class="cover-title" data-anim style="--i:1"><span class="ct-inner">펫 산업 특강</span></h1>
      <p class="cover-sub" data-anim style="--i:2">시장을 문제와 기회 관점으로 보기</p>
      <div class="cover-rule" data-anim style="--i:3"></div>
      <p class="cover-program" data-anim style="--i:4">M3 산업 특화 × AI · 펫 분야 특화교육</p>
      <p class="cover-meta" data-anim style="--i:5">13:05–13:45 · 40분</p>
      <div class="cover-quote-wrap" data-anim style="--i:6">
        <div class="cover-quote">시장 규모보다 먼저, <b>어떤 고객의 어떤 문제가 커지고 있는가</b>를 봅니다</div>
      </div>
    </section>`;
}

function contentSlide(s){
  return `
    <section class="slide">
      <header class="s-head">
        ${s.emoji?`<div class="s-emoji" data-anim style="--i:0">${s.emoji}</div>`:''}
        <p class="kicker" data-anim style="--i:1">${s.kicker||s.part||''}</p>
        <h2 class="s-title" data-anim style="--i:2">${s.title||''}</h2>
        ${s.sub?`<p class="s-sub" data-anim style="--i:3">${s.sub}</p>`:''}
      </header>
      <div class="s-body">${s.body||''}</div>
      ${s.insight?`<div class="insight-wrap" data-anim style="--i:7"><div class="insight">${s.insight}</div></div>`:''}
    </section>`;
}

function dividerSlide(s){
  return `
    <section class="slide s-divider">
      <div class="ghost" aria-hidden="true">${s.ghost||''}</div>
      <p class="div-kicker" data-anim style="--i:0">${s.kicker||s.part||''}</p>
      <h2 class="div-title" data-anim style="--i:1">${s.title||''}</h2>
      ${s.sub?`<p class="div-sub" data-anim style="--i:2">${s.sub}</p>`:''}
    </section>`;
}

/* content 제작 단계에서 그대로 사용할 공통 컴포넌트 */
function cardGrid(cols,cards){
  return `<div class="cards cards--${cols}">${cards.map((c,i)=>`<article class="card${c.hl?' card--hl':''}" data-anim style="--i:${i}">${c.icon?`<div class="card__icon">${c.icon}</div>`:''}${c.num?`<div class="card__num">${c.num}</div>`:''}${c.label?`<div class="card__label">${c.label}</div>`:''}${c.title?`<div class="card__title">${c.title}</div>`:''}${c.desc?`<div class="card__desc">${c.desc}</div>`:''}</article>`).join('')}</div>`;
}
function table(headers,rows){
  return `<table class="tbl" data-anim><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function twoCol(left,right){
  const col=c=>`<div class="col${c.hl?' col--hl':''}" data-anim>${c.icon?`<div class="col__icon">${c.icon}</div>`:''}${c.title?`<div class="col__title">${c.title}</div>`:''}${c.sub?`<div class="col__sub">${c.sub}</div>`:''}${c.list?`<ul class="col__list">${c.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>`;
  return `<div class="twocol">${col(left)}${col(right)}</div>`;
}

const deck=document.getElementById('deck');
const prev=document.getElementById('prev');
const next=document.getElementById('next');
const progress=document.getElementById('progress');
const counter=document.getElementById('counter');
const menuToggle=document.getElementById('menuToggle');
const scrim=document.getElementById('scrim');
const menuList=document.getElementById('menuList');
let current=0;
let touchStartX=0;

function renderDeck(){
  deck.innerHTML=SLIDES.map(s=>s.type==='cover'?coverSlide():s.type==='divider'?dividerSlide(s):contentSlide(s)).join('');
  [...deck.querySelectorAll('.slide')].forEach((slide,i)=>slide.classList.toggle('is-active',i===0));
  requestAnimationFrame(()=>deck.querySelector('.slide.is-active')?.classList.add('reveal'));
  renderMenu();
  updateChrome();
}

function renderMenu(){
  const parts=[];
  SLIDES.forEach((s,i)=>{
    let group=parts.find(p=>p.name===s.part);
    if(!group){group={name:s.part,items:[]};parts.push(group)}
    group.items.push({index:i,label:s.menu||s.title||`슬라이드 ${i+1}`});
  });
  menuList.innerHTML=parts.map(group=>`<div class="menu-group"><div class="menu-part">${group.name}</div>${group.items.map(item=>`<button class="menu-item" type="button" data-index="${item.index}">${item.label}</button>`).join('')}</div>`).join('');
  menuList.querySelectorAll('.menu-item').forEach(btn=>btn.addEventListener('click',()=>{goTo(Number(btn.dataset.index));closeMenu()}));
}

function scaleDeck(){
  const sw=1280,sh=905;
  const scale=Math.min(innerWidth/sw,innerHeight/sh);
  deck.style.transform=`translate(-50%,-50%) scale(${scale})`;
}

function activeSlide(){return deck.querySelectorAll('.slide')[current]}
function revealSlide(slide){
  slide.classList.remove('reveal');
  slide.querySelectorAll('.frag').forEach(f=>f.classList.remove('is-shown'));
  requestAnimationFrame(()=>requestAnimationFrame(()=>slide.classList.add('reveal')));
}
function showNextFragment(){
  const hidden=[...activeSlide().querySelectorAll('.frag')].find(f=>!f.classList.contains('is-shown'));
  if(!hidden)return false;
  hidden.classList.add('is-shown');
  return true;
}
function hideLastFragment(){
  const shown=[...activeSlide().querySelectorAll('.frag.is-shown')];
  if(!shown.length)return false;
  shown.at(-1).classList.remove('is-shown');
  return true;
}
function goTo(index){
  index=Math.max(0,Math.min(SLIDES.length-1,index));
  if(index===current)return;
  const slides=[...deck.querySelectorAll('.slide')];
  const old=slides[current],nextSlide=slides[index];
  old.classList.remove('is-active','reveal','is-leaving-left');
  if(index>current)old.classList.add('is-leaving-left');
  nextSlide.classList.remove('is-leaving-left');
  nextSlide.classList.add('is-active');
  current=index;
  revealSlide(nextSlide);
  updateChrome();
}
function goNext(){if(showNextFragment())return;goTo(current+1)}
function goPrev(){if(hideLastFragment())return;goTo(current-1)}

function updateChrome(){
  const total=SLIDES.length;
  prev.disabled=current===0;
  next.disabled=current===total-1 && ![...activeSlide().querySelectorAll('.frag')].some(f=>!f.classList.contains('is-shown'));
  progress.style.width=`${((current+1)/total)*100}%`;
  counter.innerHTML=`<span class="cur">${String(current+1).padStart(2,'0')}</span><span>/</span><span class="tot">${String(total).padStart(2,'0')}</span>`;
  menuList.querySelectorAll('.menu-item').forEach((btn,i)=>btn.classList.toggle('is-active',i===current));
}
function openMenu(){document.body.classList.add('menu-open');menuToggle.setAttribute('aria-expanded','true');menuToggle.setAttribute('aria-label','슬라이드 목차 닫기')}
function closeMenu(){document.body.classList.remove('menu-open');menuToggle.setAttribute('aria-expanded','false');menuToggle.setAttribute('aria-label','슬라이드 목차 열기')}
function toggleMenu(){document.body.classList.contains('menu-open')?closeMenu():openMenu()}

prev.addEventListener('click',goPrev);
next.addEventListener('click',goNext);
menuToggle.addEventListener('click',toggleMenu);
scrim.addEventListener('click',closeMenu);
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeMenu();return}
  if(document.body.classList.contains('menu-open'))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();goNext()}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();goPrev()}
  if(e.key==='Home'){e.preventDefault();goTo(0)}
  if(e.key==='End'){e.preventDefault();goTo(SLIDES.length-1)}
});
addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>60)(dx<0?goNext:goPrev)()},{passive:true});
addEventListener('resize',()=>{scaleDeck();resizeCanvas()});

/* ---------- animated line background ---------- */
const canvas=document.getElementById('bg-lines');
const ctx=canvas.getContext('2d');
let cw=0,ch=0,dpr=1,t=0;
function resizeCanvas(){
  dpr=Math.min(devicePixelRatio||1,2);cw=innerWidth;ch=innerHeight;
  canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);canvas.style.width=`${cw}px`;canvas.style.height=`${ch}px`;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function drawBackground(){
  t+=0.004;
  ctx.clearRect(0,0,cw,ch);
  const grad=ctx.createLinearGradient(0,0,cw,ch);grad.addColorStop(0,'#fffef9');grad.addColorStop(.62,'#fffaf0');grad.addColorStop(1,'#fff6c9');ctx.fillStyle=grad;ctx.fillRect(0,0,cw,ch);
  const lines=[{y:.18,a:30,w:1.3,o:.16,s:.7},{y:.34,a:42,w:1.0,o:.10,s:.5},{y:.58,a:36,w:1.4,o:.13,s:.65},{y:.76,a:28,w:1.0,o:.09,s:.45}];
  lines.forEach((l,idx)=>{
    ctx.beginPath();
    for(let x=-40;x<=cw+40;x+=12){const y=ch*l.y+Math.sin(x*.008+t*l.s*6+idx)*l.a+Math.cos(x*.003-t*3+idx)*l.a*.35;if(x===-40)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
    ctx.strokeStyle=`rgba(181,140,0,${l.o})`;ctx.lineWidth=l.w;ctx.stroke();
  });
  const glow=ctx.createRadialGradient(cw*.82,ch*.2,0,cw*.82,ch*.2,Math.max(cw,ch)*.42);glow.addColorStop(0,'rgba(245,196,0,.14)');glow.addColorStop(1,'rgba(245,196,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,cw,ch);
  requestAnimationFrame(drawBackground);
}

resizeCanvas();
renderDeck();
scaleDeck();
drawBackground();
</script>
