<!DOCTYPE html>

<script>
(async()=>{
  const response=await fetch('./original.html?v=20260829');
  let html=await response.text();
  const replacement=`<details><summary>[참고] GitHub Pages로 웹 MVP 배포하기</summary><div class="details-body"><h4>GitHub Pages를 활용한 웹 MVP 배포</h4><ol><li><b>GitHub에 새 Repository 생성</b><ul><li>GitHub에서 새로운 Repository를 생성합니다.</li><li>Repository 이름 예시: <code>pet-nest</code></li><li>GitHub Pages를 이용해 외부에 공개할 수 있도록 <b>Public 저장소</b>로 생성합니다.</li></ul></li><li><b>웹 MVP 프로젝트 파일 업로드</b><ul><li>제작한 웹 MVP 프로젝트 파일을 Repository에 업로드합니다.</li><li>예: <code>index.html</code>, <code>style.css</code>, <code>script.js</code>, 이미지 파일 등</li><li>웹사이트의 시작 페이지는 일반적으로 <code>index.html</code>로 구성합니다.</li></ul></li><li><b>GitHub Pages 설정</b><ul><li>Repository의 <b>Settings → Pages</b> 메뉴로 이동합니다.</li><li><b>Build and deployment</b>에서 배포 방식을 설정합니다.</li><li>Branch를 <code>main</code>으로 선택하고 폴더는 <code>/ (root)</code>로 지정한 후 <b>Save</b>를 클릭합니다.</li></ul></li><li><b>배포 URL 확인</b><ul><li>설정이 완료되면 GitHub Pages가 웹사이트를 자동으로 배포합니다.</li><li>배포 주소는 일반적으로 다음과 같은 형태입니다.</li></ul><div class="prompt-block"><div class="prompt-head"><span>URL 형식</span><button class="copy-btn">복사</button></div><pre><code>https://GitHub아이디.github.io/Repository이름/</code></pre></div><p>예:</p><div class="prompt-block"><div class="prompt-head"><span>배포 URL 예시</span><button class="copy-btn">복사</button></div><pre><code>https://heejeong-kim.github.io/pet-nest/</code></pre></div></li><li><b>최종 배포 테스트</b><ul><li>생성된 GitHub Pages URL에 접속합니다.</li><li>웹페이지가 정상적으로 표시되는지 확인합니다.</li><li>이미지, 버튼, 링크, JavaScript 기능 등이 정상적으로 작동하는지도 함께 테스트합니다.</li></ul></li></ol><div class="note"><b>✅ 최종 배포 주소 예시</b><br><code>https://heejeong-kim.github.io/ku-ai-nest/</code></div></div></details>`;
  const pattern=/<details><summary>\[참고\] GitHub Pages로 웹 MVP 배포하기<\/summary><div class="details-body">[\s\S]*?<\/div><\/details>/;
  if(!pattern.test(html)) throw new Error('GitHub Pages 안내 영역을 찾지 못했습니다.');
  html=html.replace(pattern,replacement);
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<main style="font-family:sans-serif;padding:40px"><h1>페이지를 불러오지 못했습니다.</h1><p>'+err.message+'</p></main>';
});
</script>
